# 몬스터 카드 효과의 발동 조건 — 완성 기준 4번 「발동(나머지)」 (docs/완성_기준.md
# 「완성 기준 4번 — 엄격 해석으로 확정」 절, 허가 ①, 2026-10-26 사용자 결정).
#
# `cards/발동조건/던전마스터.yaml`·`cards/발동조건/격투가.yaml` 머리 주석과 같은
# 문법·경계다 — 반복하지 않고 요점만: 이 파일은 "발동할 수 있는가"만 적는다(효과 해결은
# 2단계), `engine/legalmoves.py` 의 `_몬스터스킬발동_후보들`이 읽는다, `조건`은
# `engine/expr.py` 식 언어 그대로다.
#
# 103회차 — 새 덱(세리) 첫 회차. 새 술어 둘만 더했다(둘 다 engine/predicates.py) —
# `공허.매수()`(`패.매수()`와 같은 패턴, 델레가토르·두플리카토르·엑삭토르·릭토르
# [유언]의 "제외 존에서 3장 되돌리고"가 처음 필요로 했다) · `아카이브.카드군매수()`
# (`덱.카드군매수()`의 아카이브+레벨 버전, 치프 세리 3번이 처음 필요로 했다). 그 외엔
# 기존 술어(`유닛존빈칸있음()` · `덱.카드군있음()`)만으로 충분했다. `cards/효과/
# 세리.yaml` 머리 주석이 이번 회차가 못 닫은 자리(코스트 납부자·매수 변경, 가해자 축,
# 폴백 소스, 효과 치환, 전역 즉시 트리거, 체인 무효, [제약] 대체 소환, 목록형 존
# "전부", 키워드없음 마법 카드 발동 후 거처)를 전부 적어 뒀다 — 이 파일에는 그 카드들의
# 조건을 안 적는다(효과 자체가 없으니 발동 가능 판정도 의미가 없다).
#
# **"3장 골라"(자유 선택, 공허 전체에서)는 1층에 매수만 묻는다** — 어느 3장을 고를지는
# 2단계 일이다(래빗 풋 1번과 같은 원칙).
#
# **104회차 — 세제 2·3번을 더했다.** 세제는 스킬 카드(룰지 1-4, "처음부터 스킬 존에
# 있다")라 위치를 따로 안 묻는다(투기장의 규칙과 같은 전례). 둘 다 키워드 없는 「일반」
# 효과라 `키워드`를 생략한다(기본값 '없음' = 자신 턴·진행 단계, `_발동조건_타이밍통과`
# 참조). "~하고 발동"(룰지 3-2, 코스트 구문)이 있어 룰지 3-6 e(코스트를 전부 치를 수
# 있어야 발동을 선언할 수 있다)대로 자신이 그 코스트를 치를 수 있는지를 묻는다 — 새
# 술어 둘(`메인덱.매수()`·`상급덱.매수()`, `패.매수()`·`공허.매수()`와 같은 패턴)을
# 더했다. 카드 자신의 "부족시" 절(`engine/effects.py` 모듈 docstring '## 폴백 소스'
# 참조)이 모자란 만큼을 다른 덱에서 채우므로, 전제는 "주 출처 단독 N장"이 아니라 "두
# 덱을 합쳐 N장"이다. '서로가' 치르는 상대 쪽 몫은 발동 가능 판정과 무관하다 — 상대가
# 모자라면 그 쪽 `이동`만 조용히 불발하고(엑삭토르 1번과 같은 독립 사건) 내 발동 자체는
# 그대로 성립한다.

효과:
  - 카드: 세리 - 델레가토르
    번호: 2
    키워드: 유언
    위치: 아카이브
    조건: "유언직후('세리 - 델레가토르') and 공허.매수() >= 3
      and 덱.카드군있음('세리', 유형='몬스터') and 유닛존빈칸있음()"
    근거: "'[유언] 자신의 제외 존에서 카드를 3장 골라 자신의 덱으로 되돌리고 발동. 자신의
      메인 덱에서 「세리」 몬스터를 1장 특수소환한다.' 비용(공허 3장)과 효과(메인덱 서치+
      특수소환)가 서로 다른 풀이라 51·79회차형 겹침 문제가 없다 — 둘 다 그냥 매수·존재만
      묻는다."

  - 카드: 세리 - 두플리카토르
    번호: 2
    키워드: 유언
    위치: 아카이브
    조건: "유언직후('세리 - 두플리카토르') and 공허.매수() >= 3
      and 덱.카드군있음('세리', 유형='몬스터') and 유닛존빈칸있음()"
    근거: "델레가토르 2번과 글자까지 같은 문장 — 같은 이유로 같은 조건."

  - 카드: 세리 - 엑삭토르
    번호: 1
    키워드: 소환
    위치: 필드
    조건: "필드.있음('세리 - 엑삭토르')"
    근거: "'[소환] 서로 자신의 덱의 위에서부터 카드를 5장 제외한다.' 비용 없고 대상 선택도
      없는 블라인드 제외라 이 카드가 필드에 있다는 것 외엔 더 물을 것이 없다 — 한쪽
      덱이 5장 미만이어도 그 쪽만 조용히 불발하고 발동 자체는 성립한다(효과/세리.yaml
      엑삭토르 1번 근거 참조)."

  - 카드: 세리 - 엑삭토르
    번호: 2
    키워드: 유언
    위치: 아카이브
    조건: "유언직후('세리 - 엑삭토르') and 공허.매수() >= 3
      and 덱.카드군있음('세리', 유형='몬스터') and 유닛존빈칸있음()"
    근거: "델레가토르 2번과 글자까지 같은 문장 — 같은 이유로 같은 조건."

  - 카드: 세리 - 릭토르
    번호: 2
    키워드: 유언
    위치: 아카이브
    조건: "유언직후('세리 - 릭토르') and 공허.매수() >= 3
      and 덱.카드군있음('세리', 유형='몬스터') and 유닛존빈칸있음()"
    근거: "델레가토르 2번과 글자까지 같은 문장 — 같은 이유로 같은 조건."

  - 카드: 치프 세리 - 프로쿠라토르
    번호: 3
    키워드: 유언
    위치: 아카이브
    조건: "유언직후('치프 세리 - 프로쿠라토르')
      and 아카이브.카드군매수('세리', 유형='몬스터', 레벨=3) >= 2 and 유닛존빈칸있음()"
    근거: "'[유언] 자신의 묘지에서 3레벨 「세리」 몬스터를 2장 특수소환한다.' '2장'은
      존재 유무(`아카이브.카드군있음()`)로 못 물어 매수 술어를 새로 쓴다(54회차 `덱.
      카드군매수()`와 같은 이유, 위 모듈 머리 주석 참조)."

  - 카드: 세제
    번호: 2
    조건: "(메인덱.매수() + 상급덱.매수()) >= 9"
    근거: "'서로가 자신의 메인 덱에서 카드를 9장 제외하고 발동. 자신의 메인 덱에서 2장
      드로우한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서
      부터 대신 제외한다.' 코스트(룰지 3-2 '~고 발동')라 룰지 3-6 e대로 치를 수 있는지를
      먼저 묻는다 — '부족시' 폴백(2단계, `engine/effects.py` 모듈 docstring '## 폴백
      소스' 참조)이 있어 전제는 메인덱 단독 9장이 아니라 메인덱+상급덱 합계 9장이다(위
      모듈 머리 주석 104회차 절 참조)."

  - 카드: 세제
    번호: 3
    조건: "(상급덱.매수() + 메인덱.매수()) >= 4"
    근거: "'서로가 자신의 상급 덱에서 카드를 4장 제외하고 발동. 자신의 상급 덱에서 1장
      드로우한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 메인 덱의 위에서
      부터 대신 제외한다.' 2번과 같은 이유, 방향만 반대(상급덱이 주 출처, 메인덱이
      폴백)."
