      신속과 같이 항상 통과시킨다) 실제 제약은 `조건` 문자열이 전부 진다 — 새 사건 술어
      `상대몬스터소환직후()`(engine/predicates.py, 위 머리 주석)가 그 사건을 묻는다. 이
      카드는 지금 필드에 있어야(아직 릴리스하기 전) 뜻이 성립하는 효과라 필드.있음()으로
      묻는다(레시나 3번과 같은 이유). '이 카드를 릴리스하고'(코스트)·'상대 필드의 카드
      1장을 대상으로 하고'(자유 선택 대상)는 둘 다 2단계(효과 해결)의 일이라 1층 조건에는
      안 들어간다 — 코스트를 치르면 이 카드 자신이 필드를 벗어나 다시 평가되지 않으므로
      (반혼체 4번 등 '자기 자신을 코스트로 쓰는' 기존 카드들과 같은 모양) 별도의
