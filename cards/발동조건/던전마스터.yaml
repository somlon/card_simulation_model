    근거: "'패의 이 카드를 버리고 발동. 덱에서 「트랩」 또는 「다크」 마법 카드를 2장 세트한다.'
      (54회차 — 49~53회차가 「세트」가 새 동작이라 범위 밖에 남겨 둔 자리). '세트'는 룰지가
      말하는 동작으로는 새 동작이 아니었다 — 재정 [던전마스터 2](G3, `rules/원본/재정_질문_답변_
      정리_2026-10-24.txt` '트랩퍼 1번' 문항)가 '[세트]는 마법 카드를 마법 존에 뒷면으로 놓는
      것'이라고 룰지 1-2를 인용해 정의하는데, 룰지 1-2(`뉴_네오_룰지_2026-10-23.txt`)가 말하는
      '이펙트 카드를 뒷면으로 이펙트 존에 놓는 것'(=로드)과 같은 동작이다('마법 카드'·'마법
      존'은 재정이 쓰는 구용어고, `data/card_pool.json`의 `type` 필드가 쓰는 신용어가
      '마법'이라 카드 데이터와는 바로 대응한다 — 용어가 둘이지 동작이 둘인 게 아니다). **그런데
      1층은 '발동할 수 있는가'만 판정하고 '발동하면 무엇이 일어나는가'(세트 그 자체를 수행하는
      것)는 2단계의 일이라(위 파일 머리 경계), 이 조건은 '세트'라는 새 동작 서술자를 전혀 쓰지
      않는다** — 다른 특수소환형 효과(암흑의 율법 2번 등, 46회차 결정)와 같은 이름표
      `발동('던전마스터 새크리파이스', 3)`로 낸다. 남은 벽은 '2장'(매수 확인)과 세트할 자리였다
      — '매수 ≥2 존재 확인'은 `덱.카드군있음()`(있다/없다만 답함)으로 못 물어 새 술어
      `덱.카드군매수()`(여러 카드군을 OR로 받아 매수를 내는 `덱.카드군있음()`의 매수 버전)를
      추가했고, '세트할 자리'는 로드와 같은 동작이라(위) 로드가 쓰는 이펙트 존 5칸을 그대로
      쓴다 — `_로드_후보들`(44회차)은 1장만 놓아 빈 칸 유무만 봤지만 2장을 놓으려면 매수가
      필요해 새 술어 `이펙트존빈칸수()`를 추가했다(룰지 3-6 e, 코스트 치른 뒤까지 효과가 전부
      성립해야 발동을 선언할 수 있다는 같은 전제 — 51회차 `아카이브.카드군분할가능()`·52회차
      마르모르·카르분쿨루스 1번과 같은 근거). 대상은 '마법 카드'로 좁혀 있어(몬스터·스킬 제외)
      `유형='마법'`을 넘긴다. 비용은 이 카드 자신을 패에서 버리는 것이고(새크리파이스 1·2번과
      같은 모양), 버려지는 카드가 바로 이 카드라 자원 존재 확인이 따로 필요 없다."

