# `engine/legalmoves.py` 모듈 docstring 80회차 항목 참조.
#
# **이것으로 「완성 기준 4번」 ①(발동 조건 표현 언어 확장)이 범위로 잡은 두 덱 14종·다섯
# 키워드([신속]·[트리거]·[지속]·[소환]·[유언]) 전부가 끝났다.** 남는 것은 강제 발동
# (다크 엠퍼러·헬·컨트롤러의 [유언] 3번, 녹스 솜니페르 4번)뿐이고, 이들은 사용자 결정
# 2026-10-27이 이미 "허가를 넓혀도 안 풀린다 — 애초에 `가용수단` 대상이 아니다"라고
# 확정해 둔 자리라 `커버하지_않음`에서 세지 않는다(위 머리 주석, 79회차까지의 설명과 같다).
#
# **의도적으로 범위 밖에 남긴 것** (여전히 범위 밖 — 위 설명대로 세 키워드가 아니라 강제
# 발동이라서, 또는 룰지 자체가 다른 키워드로 적어서):
# - 레시나·실렉스 2번([지속]) — 사용자의 2026-10-26 판정("필드의 지속 효과를 발동 후보로
#   내지 마세요")이 그대로 적용되는 자리라 이번 허가로도 안 열린다(키워드 자체가 다르다)
# - **녹스 솜니페르 4번**([트리거], "이 효과는 강제로 발동한다") — 강제 발동이라 다크
#   엠퍼러 3번·헬 3번·컨트롤러 3번([유언] 강제)과 같은 이유로 범위 밖이다(선택지가 아니라
#   결과 처리, `가용수단` 대상이 아니다). [트리거] 타이밍 게이트가 열려도 강제라는 별도
#   사유가 그대로 남아 있어 혼동하지 않는다

효과:
  - 카드: 호박옥 - 결정충
    번호: 2
    키워드: 신속
    위치: 패 또는 필드
    조건: "(패.있음('호박옥 - 결정충') and 필드.몬스터수() >= 1)
      or (필드.있음('호박옥 - 결정충') and 필드.몬스터수() >= 2)"
    근거: "'[신속] 이 카드를 패 또는 필드에서 묘지로 보내고 발동. 자신 필드의 몬스터 1장에
      봉인 카운터를 1개 놓는다.' 코스트가 '패 또는 필드'를 가려 두 조건이 갈린다 — 패에서
      보내면 필드 몬스터 수에 영향이 없어 필드.몬스터수() >= 1 이면 되지만, 필드에서 보내면
      이 카드 자신이 그 수에서 빠지므로(룰지 3-6 e, 위 머리 주석) 자기 자신을 뺀 나머지가
      1장 이상 있어야 해 필드.몬스터수() >= 2 로 적었다(둘 다 자신을 포함해 세는 지금 값
      기준). 필드.있음()·필드.몬스터수() 둘 다 앞면 카드만 본다는 전제(engine/state.py
      필드카드들())를 그대로 쓴다 — 뒷면 유닛은 룰지 3-6('뒷면 유닛의 효과는 발동할 수
      없다')이 이미 걸러 준다."

  - 카드: 호박옥 - 결정충
    번호: 3
    키워드: 신속
    위치: 패
    조건: "패.있음('호박옥 - 결정충') and not 필드.비덱카드있음() and 유닛존빈칸있음()"
    근거: "'[신속] 자신 필드에 「호박옥」 카드 이외의 카드가 없다면, 이 카드를 패에서 수비
      표시로 특수소환한다.' 새 술어 필드.비덱카드있음()이 덱상수.테마('호박옥')를 안 쓰는
      카드가 내 필드(유닛존 · 이펙트존 · 소유한 필드존/공유존)에 있는지를 본다 — 필드가
      비어 있으면(아무 카드도 없음) 당연히 거짓이라 조건을 만족한다. 특수소환이라
      유닛존빈칸있음()이 다크 엠퍼러 1번과 같은 이유로 필요하다."

  - 카드: 호박옥 - 잔편
    번호: 1
    키워드: 신속
    위치: 패
    조건: "패.있음('호박옥 - 잔편') and 필드.몬스터이외없음('호박옥 - 아우렘 티라누스')
      and 유닛존빈칸있음()"
    근거: "'[신속] 자신 필드에 「아우렘 티라누스」 이외의 몬스터가 존재하지 않을 때 발동.
      이 카드를 패에서 수비 표시로 특수소환한다.' 새 술어 필드.몬스터이외없음(이름)이
      내 유닛존의 앞면 몬스터 전부가 그 이름이거나(또는 몬스터가 아예 없거나)를 본다 —
      카드 이름은 인수로만 들어가 덱 중립이다(덱.이름포함있음()과 같은 패턴). 결정충 3번과
      달리 '카드'가 아니라 '몬스터'로 좁혀 있어 필드.비덱카드있음()이 아니라 몬스터 전용
      새 술어를 썼다."

  - 카드: 호박옥 - 수액정
    번호: 1
    키워드: 없음
    위치: 패
    조건: "패.있음('호박옥 - 수액정') and 카운터있는유닛있음() and 유닛존빈칸있음()"
    근거: "'자신 필드에 봉인 카운터가 놓인 몬스터가 존재할 때 발동. 이 카드를 패에서
      특수소환할 수 있다.' 키워드 표시가 없어 기본값(자신 턴 · 진행 단계)을 쓴다. 새 술어
      카운터있는유닛있음()은 카운터최다유닛()과 같은 전제(앞면 유닛 · 덱상수.카운터명
      기본값)로 '카운터 1개 이상인 유닛이 있는가'만 bool로 낸다(식 언어에 None 리터럴이
      없어 카운터최다유닛() != None 꼴을 못 쓴다)."

  - 카드: 호박옥 - 반혼체
    번호: 1
    키워드: 없음
    위치: 필드
    조건: "필드.있음('호박옥 - 반혼체')
      and 아카이브.카드군분할가능('호박옥', 2, 남길유형='몬스터')
      and 유닛존빈칸있음() and 효과사용횟수('호박옥 - 반혼체', 1) < 1"
    근거: "'자신 묘지의 「호박옥」 카드 2장을 덱으로 되돌리고 발동. 자신 묘지의 「호박옥」
      몬스터 1장을 특수소환한다. 이 효과로 특수소환한 몬스터는 이 턴에 공격할 수 없다.'
      비용이 이 카드 자신이 아니라 묘지 자원이라 암흑의 율법 2번·컨트롤러 1번과 같은 모양
      (필드에 남아 있는 카드가 묘지를 참조)이고, 코스트와 효과 대상이 같은 묘지 풀을
      나눠 쓰는 점만 다르다(위 머리 주석 — 새 술어 아카이브.카드군분할가능() 참조). 특수
      소환이라 유닛존빈칸있음()이 필요하고, 이 카드는 쓴 뒤에도 필드에 남는 보스 몬스터라
      (다크 엠퍼러 2번·암흑의 율법 2번·컨트롤러 1번·헬 1번과 같은 모양) 룰지 1장 전역
      규칙('모든 효과는 1턴에 1번')이 걸려 효과사용횟수('호박옥 - 반혼체', 1) < 1 로
      적었다."

  - 카드: 호박옥의 수호자 - 마르모르
    번호: 1
    키워드: 신속
    위치: 상급덱
    조건: "덱.있음('호박옥의 수호자 - 마르모르')
      and (필드.몬스터수() > 면역유닛수() or (필드.카운터합() >= 3 and 유닛존빈칸있음()))"
    근거: "'[신속] 자신 필드의 몬스터 1장을 릴리스하고 발동. 이 카드를 특수소환한다. 필드의
      릴리스 가능한 몬스터가 없는 경우, 대신 봉인 카운터 3개를 제거하고 소환할 수 있다.'
      이 카드 자신은 상급덱에서 시작하므로(`data/card_pool.json` deck='상급') 덱.있음()으로
      존재를 확인한다(31회차 선례, 메인·상급 둘 다 봄). '릴리스 가능한 몬스터가 있는가'는
      필드.몬스터수() > 면역유닛수() 로 묻는다 — 면역유닛()이 이미 '카운터 ≥ 벽유지최소(1)면
      릴리스 면역'을 모델링해 두므로(21~25회차) 그보다 몬스터 수가 많으면 면역이 아닌 몬스터가
      최소 1장 있다는 뜻이다. 릴리스 경로는 코스트(릴리스)가 유닛존 자리를 하나 비운 뒤 그
      자리로 특수소환되므로 유닛존빈칸있음()이 따로 필요 없다(룰지 3-6 e, 코스트 치른 뒤
      상태로 판정). 카운터 대체 경로는 릴리스가 없어 자리가 안 비므로 유닛존빈칸있음()을
      그대로 쓴다. 대체 카운터 3개는 '자신 필드 전체 합계로 뗀다'(재정 4차 Q21,
      maps/호박옥_봉인의_계약.yaml C 노드 '마르모르·카르분쿨루스 1번 재전개', 23회차)는
      이미 확정된 해석이라 필드.카운터합()을 그대로 쓴다. 그 맵 노드는 이 효과를
      소환('카드', 1, 대체비용=카운터3)로 적지만, 다른 특수소환형 효과(암흑의 율법 2번 등)와
      같은 이름표(발동)로 내는 것은 49회차부터의 관례이고 맵 노드의 결론은 바꾸지 않았다(위
      머리 주석). 이 카드는 쓰이면 상급덱을 떠나 덱.있음()이 저절로 거짓이 되므로(다크
      엠퍼러 1번과 같은 '쓰이면 자원이 자연 소모' 패턴) 효과사용횟수() 같은 별도 제약이
      필요 없다."

  - 카드: 호박옥의 수호자 - 카르분쿨루스
    번호: 1
    키워드: 신속
    위치: 상급덱
    조건: "덱.있음('호박옥의 수호자 - 카르분쿨루스')
      and (필드.몬스터수() > 면역유닛수() or (필드.카운터합() >= 3 and 유닛존빈칸있음()))"
    근거: "마르모르 1번과 글자 하나까지 같은 텍스트 — 위 마르모르 1번과 같은 근거다. 카드
      이름만 다르다(덱 중립 — 인자로만 들어간다)."

  - 카드: 호박옥의 수호자 - 레시나
    번호: 3
    키워드: 트리거
    위치: 필드
    조건: "필드.있음('호박옥의 수호자 - 레시나') and 체인에상대효과있음()
      and 효과사용횟수('호박옥의 수호자 - 레시나', 3) < 2"
    근거: "'[트리거] 상대가 효과를 발동했을 때 발동. 필드의 몬스터에게 봉인 카운터를 2개
      놓는다. (이 효과는 1턴에 2번까지 사용할 수 있다.)' 룰지 5장 키워드표가 [트리거]를
      '위의 키워드를 제외한 조건 명시'라고만 적어 신속·소환·유언·지속과 달리 고유 턴·단계
      제한이 없다(`_발동조건_타이밍통과`가 신속과 같이 항상 통과시킨다) — 실제 제약은
      카드 텍스트의 조건 그대로 '상대가 효과를 발동했는가' 하나뿐이라 새 술어
      체인에상대효과있음()(기존 체인에상대제거효과있음()에서 분류=='제거' 필터만 뺀 자매
      함수)로 적는다. '1턴에 2번까지'는 효과사용횟수('호박옥의 수호자 - 레시나', 3) < 2
      로 적는다(49회차의 '< 1'과 같은 식, 상한만 다르다 — 상한이 숫자로 카드 텍스트에
      그대로 적혀 있어 추측이 아니다). 이 카드는 1·2번(소환 시 카운터 놓기·릴리스·파괴
      내성)으로 이미 필드에 나와 있어야 뜻이 성립하는 효과라 필드.있음()으로 묻는다(마르모르
      1번이 덱.있음()을 쓰는 것과 반대 — 그 카드는 상급덱에서 바로 나오는 효과라 달랐다)."

  - 카드: 호박옥의 수호자 - 실렉스
    번호: 3
    키워드: 트리거
    위치: 필드
    조건: "필드.있음('호박옥의 수호자 - 실렉스') and 체인에상대효과있음()
      and 효과사용횟수('호박옥의 수호자 - 실렉스', 3) < 2"
    근거: "레시나 3번과 '1턴에 2번까지' 조건까지 같은 모양이다 — 효과 자체('「호박옥」 카드
      1장을 덱/묘지에서 패에 넣는다')만 다르고 그 차이는 2단계(효과 해결)의 일이라 1층
      발동 조건에는 영향이 없다. 카드 이름만 다르다(덱 중립 — 인자로만 들어간다)."

  # ---- 78회차 — [소환]·[유언] 키워드 (사용자 결정 2026-10-27, ①) — 조건 없는 묶음 ----

  - 카드: 호박옥 - 아우렘 티라누스
    번호: 1
    키워드: 소환
    위치: 상급덱 또는 필드
    조건: "소환직후('호박옥 - 아우렘 티라누스')
      and 효과사용횟수('호박옥 - 아우렘 티라누스', 1) < 1"
    근거: "'[소환] 이 카드에 봉인 카운터를 3개 놓는다.' 대상이 이 카드 자신이라(다크 엠퍼러
      1번과 같은 이유) 소환직후() 하나로 '지금 열려 있는가'를 답한다. 룰지 1장 전역 규칙
