  # 키워드 효과가 아니라 **마법 카드**([트리거] 구분)의 강제 발동이다 — 이 파일 머리 주석이
  # "몬스터·스킬 카드 효과"로 범위를 적어 뒀지만, `_발동조건_타이밍통과()`의 트리거 키워드
  # 분기는 애초에 턴·단계로 좁히지 않고 `조건` 문자열에 전부 맡기므로(그 docstring 참조)
  # 카드 종류를 가리지 않는다 — 범위를 그어 둔 것은 "지금까지 실제로 쓴 예가 몬스터·스킬뿐"
  # 이었다는 사실이고, 메커니즘 자체의 제약은 아니었다.
  - 카드: 깨어남의 종
    번호: 1
    키워드: 트리거
    강제: true
    인수: {제거개수: 잔량전부}
    조건: "내HP() <= 2000 and 필드.있음('호박옥 - 녹스 솜니페르')
      and (패.있음('깨어남의 종') or 이펙트존.있음('깨어남의 종'))"
    근거: "'[트리거] 자신의 HP가 2000 이하가 되었을 때 자신 필드의 「호박옥 - 녹스 솜니페르」에
      놓인 봉인 카운터를 전부 제거하고 발동. 제거한 카운터 수까지 묘지에서 「호박옥」 몬스터를
      특수소환한다. (이 효과는 강제로 발동한다.)' 룰지 1-2 '트리거 — 특정 상황에 반응해서
      패 또는 필드에서 발동하는 이펙트 카드. 로드해 둔 상태에서도 조건이 맞으면 발동한다'가
      이 카드가 패에 있든(아직 로드 안 함) 이펙트 존에 뒷면으로 로드돼 있든 둘 다 발동
      후보여야 한다고 정한다 — `패.있음()`과 새 `이펙트존.있음()`(앞뒤를 안 가린다,
      `engine/predicates.py` 85회차)을 or로 묶었다. '제거개수=잔량전부'는 카드 텍스트가
      '전부 제거'라고 직접 정해 둔 값이라(플레이어가 임의로 고르는 수가 아니다) 위
      `인수:` 사전으로 고정해 넘긴다 — 82·83회차가 연 이름붙은 인수 통로를 합법수 문자열이
      아니라 이 YAML 항목 자체가 채워 주는 85회차의 새 입구다(`engine/legalmoves.py`
      `강제효과_후보들()` docstring 참조). '녹스 솜니페르에 놓인 카운터'는 발동한 카드
      자신(깨어남의 종)이 아니라 **다른 이름이 고정된 카드**를 가리켜 `대상: 자신`으로 못
      쓴다 — `engine/effects.py`의 새 `{이름: ...}` 대상 꼴(85회차)을 쓴다. '묘지에서'는
      자기 묘지 기본값(기존 관례, `아카이브.카드군있음()` 머리글 참조) 그대로다."

  # 86회차 — 「알려진 틈」 1번, 호박옥 강제 [트리거] 마법 넷의 둘째 장. 월식·몽마의 도래는
  # 아직 그대로 남겼다(`cards/효과/호박옥.yaml` 머리 주석 참조) — 카운터 합계 임계값 +
  # 분배 제거·전투 파괴자 귀속이 더 필요해서다.
  - 카드: 꿈의 파열
    번호: 1
    키워드: 트리거
    강제: true
    조건: "필드이탈직후('호박옥 - 녹스 솜니페르')
      and (패.있음('꿈의 파열') or 이펙트존.있음('꿈의 파열'))"
    근거: "'[트리거] 자신 필드의 「호박옥 - 녹스 솜니페르」가 필드에서 벗어났을 때 발동. 필드의
      모든 몬스터를 파괴한다. (이 효과는 강제로 발동한다.)' 재정 호박옥6(황금봉랍 2번 —
      '상대 효과로 덱·제외 존으로 간 경우: 발동한다. 「필드를 벗어났을 때」이므로 가는 곳을
      가리지 않는다')이 '필드에서 벗어났을 때'를 목적지 불문으로 확정해 둬서, 아카이브로
      좁은 `유언직후()`가 아니라 새 `필드이탈직후()`(`engine/predicates.py`, 86회차)를 쓴다
      — 녹스 솜니페르가 전투로 파괴됐든 다른 효과로 덱·패·공허로 갔든 전부 연다. 카드가
      패에 있든(아직 로드 안 함) 이펙트 존에 뒷면으로 로드돼 있든 둘 다 발동 후보여야
      하는 것은 깨어남의 종 1번(85회차)과 같은 룰지 1-2 조항이라 같은 `패.있음() or
      이펙트존.있음()` 꼴을 그대로 썼다."

  # 87회차 — 「알려진 틈」 1번, 호박옥 강제 [트리거] 마법 넷의 셋째 장. 몽마의 도래는
  # 전투 파괴자 귀속 미해결이 닫히기 전까지 그대로 남겼다(`진행.md` 「미해결」 참조).
  - 카드: 월식
    번호: 1
    키워드: 트리거
    강제: true
    조건: "필드.카드군카운터합('호박옥') >= 5
      and (패.있음('월식') or 이펙트존.있음('월식'))"
    근거: "'[트리거] 자신 필드의 「호박옥」 몬스터에 놓인 봉인 카운터의 합계가 5개 이상이
      되었을 때 발동. 자신 필드의 「호박옥」 몬스터에서 봉인 카운터를 5개 제거한다. 상대
      필드의 모든 몬스터를 뒷면 수비 표시로 한다. (이 효과는 강제로 발동한다.)'
      '「호박옥」 몬스터'로 **좁혀 적힌** 카드 텍스트를 그대로 따라 새 `필드_카드군카운터합()`
      (87회차, `engine/predicates.py`)을 쓴다 — 처음에는 기존 `필드_카운터합()`(자신 유닛
      존 전체, 카드군을 안 가린다)으로 충분한 줄 알았으나(두 덱에 컨트롤 이동 효과가 없고
      호박옥 테마 몬스터 10장 전부가 `groups`에 '호박옥'을 가진다는 것까지만 확인했다),
      자동 대전 500판 탐색으로 틀렸음이 드러났다 — `호박옥 - 결정충` 2번 · `호박옥 - 잔편`
      2번 · `호박옥 - 수액정` 2번 등 형제 효과의 카드 텍스트는 '자신 필드의 몬스터'로 카드군
      제한이 **없어서**, 호박옥 덱에 같이 들어간 `공용`(그룹 없음) 몬스터(선택받은 용사 ·
      매수당한 킬러 등 — `data/card_pool.json`에 `theme: '공용'`, `groups: []`)에도 봉인
      카운터가 실제로 쌓이는 판이 나왔다(시드 309 · 334 · 354 등, `docs/듀얼_점검.md`
      참조). 그래서 '내 유닛 존 전체의 합'과 '「호박옥」 몬스터만의 합'이 실제로 달라질 수
      있어 월식 쪽은 카드 텍스트가 적은 그대로 카드군으로 좁힌다 — 추측이 아니라 자동
      대전에서 반증된 가설을 고친 결과다. 카드가 패에 있든(아직 로드 안 함) 이펙트 존에
      뒷면으로 로드돼 있든 둘 다 발동 후보여야 하는 것은 깨어남의 종 · 꿈의 파열(85·86회차)
      과 같은 룰지 1-2 조항이라 같은 `패.있음() or 이펙트존.있음()` 꼴을 그대로 썼다. '5개
      제거'는 가변 개수가 아니라 카드에 **고정으로 적힌 수**라 82~86회차의 이름붙은 인수
      (`인수:` 사전) 통로를 쓰지 않는다 — `cards/효과/호박옥.yaml` 쪽 `동작`에 리터럴 5를
      그대로 적는다(아우렘 티라누스 1번 '카운터를 3개 놓는다'처럼 고정 수는 YAML에 직접
      쓰는 기존 관례와 같다)."
