# 던전마스터 · 셔플! — 구현 효과 (완성_기준_듀얼.md 2번)
#
# 호박옥 파일과 같은 규칙이고 미구현 사유 약호도 같다 — (가) [지속] 상시 효과,
# (나) 강제 트리거, (다) 가변 개수, (라) 반응형 트리거.
#
# 이 덱의 3번 [유언]("상대는 카드를 1장 드로우한다. (이 효과는 강제로 발동한다.)") 여덟 장은
# **84회차가 닫았다** — 「알려진 틈」 3번(강제 트리거)의 첫 조각. 효과 자체는 예고했던 그대로
# 「이동: 메인덱 → 패, 소유: 상대」 한 줄이다. 합법수가 아니므로(2026-10-27 사용자 판정 #4)
# `cards/발동조건/던전마스터.yaml` 에 `강제: true` 로 등록해 두고 `engine/turn.py` 의
# `강제트리거_처리()`가 자동으로 적용한다 — 이 파일은 "발동하면 무엇이 일어나는가"만 적으므로
# 여기엔 `강제` 표지가 없다(그건 "발동할 수 있는가/누가 고르는가" 쪽 파일의 일).
#
# **84회차 — 깜짝상자의 "3:" 항목을 지웠다.** 이 카드의 실제 텍스트는 1·2번 두 줄뿐이고
# 3번 효과가 없다(`data/card_pool.json` 확인) — 전에 적혀 있던 "(나) 강제 발동 [유언]."은
# 번호가 안 맞는 잘못된 항목이었다(`scripts/효과검증.py`는 카드 텍스트의 번호만 세므로 실제로는
# 세어지지 않아 들키지 않고 있었다). 깜짝상자 자신의 [유언]은 이미 2번에 구현돼 있다.
#
# **88회차 — (라)의 타이밍 훅 중 "상대가 효과를 발동했을 때" 쪽을 열었다**(호박옥.yaml
# 머리글 참조, `engine/turn.py` `반응형트리거_기회()`). 이 덱엔 그 사건을 쓰는 카드가 없고
# (망령 1은 체인 무효 모델이 따로 더 필요해 범위 밖).
# **90회차 — "상대가 몬스터를 소환했을 때"(다크나이트 1 · 트랩: 가시바늘 1)도 닫았다.**
# 사건 자체가 "발동"과 달라(룰지 3-6, 호박옥.yaml 머리글 참조) 같은 반응 기회 메커니즘을
# 타면서도 새 분류(`"소환"`)와 새 사건 술어 `상대몬스터소환직후()`가 필요했다 — 자세한
# 근거는 `cards/발동조건/던전마스터.yaml` 90회차 항목·각 카드의 `근거` 참조. 범위는 일반
# 소환만이다(효과 소환은 반응 창을 열 통로가 아직 없다 — 같은 문서 참조, 다음 조각 아님,
# 더 큰 별개 구조 벽).

