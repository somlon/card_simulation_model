      (100회차) 코스트는 호박옥 - 결정충 2번과 같은 '이 카드를 자신을 묘지로' 한 줄,
      서치는 던전마스터 컨트롤러 2번과 글자까지 같은 조건(대상이 '카드'라 몬스터로
      안 좁힌다) — 둘 다 기존 그대로, 새 모델 없음."
    동작:
      - 이동: {대상: 자신, 로: 아카이브, 이름: "새크리파이스 1 코스트"}
      - 이동: {에서: 메인덱, 로: 패, 수: 1, 조건: {테마: 던전마스터}, 이름: "새크리파이스 1"}
  2:
    근거: "2. 묘지에서 「던전마스터」 몬스터를 1장 특수소환한다."
    동작:
      - 이동: {에서: 아카이브, 로: 유닛존, 수: 1, 조건: {테마: 던전마스터, 몬스터: true}, 공수: 공격, 이름: "새크리파이스 2"}
  3:
    근거: "3. 패의 이 카드를 버리고 발동. 덱에서 「트랩」 또는 「다크」 마법 카드를 2장
      세트한다. (100회차) `_조건맞나`에 합집합 조건 키 `카드군중`을 새로 열어
      [트랩]·[다크] 중 하나라도 맞으면 통과하게 했다(engine/effects.py 모듈 docstring
      「카드군 합집합 조건」 절). '세트'는 54회차가 이미 로드(뒷면 이펙트존)와 같은
      동작으로 확정해 둔 그대로다."
    동작:
      - 이동: {대상: 자신, 로: 아카이브, 이름: "새크리파이스 3 코스트"}
      - 이동: {에서: 메인덱, 로: 이펙트존, 수: 2, 조건: {종류: 마법, 카드군중: ["트랩", "다크"]},
          앞뒤면: 뒷면, 이름: "새크리파이스 3"}

"암흑의 율법":
  1:
    미구현: "(가) [지속] 효과 치환 — 다른 효과의 내용을 바꾸는 것이라 다섯 원시 동작의 바깥이다. 치환 모델이 따로 필요하다."
  2:
    미구현: "위와 같음."

"트랩: 가시바늘":
  1:
    근거: "1. [트리거] 상대가 몬스터를 소환했을 때 발동. 그 카드를 파괴한다. (90회차 —
      「알려진 틈」 2번. 1층 조건은 `cards/발동조건/던전마스터.yaml` 참조.) '그 카드'는
      다크나이트 1번의 '상대 필드의 카드 1장을 대상으로 하고'와 달리 자유 선택이 아니라
      문장이 앞서 말한 그 몬스터(방금 소환된 것) 그대로다 — `방금소환된상대몬스터`
      대상 말(engine/effects.py, `상태.마지막소환카드`를 그대로 읽는다)로 고정한다."
    동작:
      - 이동: {대상: 방금소환된상대몬스터, 로: 아카이브, 이름: "가시바늘 1 파괴"}

"트랩: 깜짝상자":
  1:
    미해결: "효과 치환 + 「누구의 덱」 질문이 안 닫혔다(진행.md 미해결)."

"트랩: 거짓 샘물":
  1:
    미구현: "(라) [트리거] + 턴 종료까지 상대에게 지속 효과를 거는 꼴 — (가)도 함께 걸린다."

"트랩 리페어 시스템":
  1:
    미구현: "(다) 「3장까지」 가변 개수 — 82회차가 연 통로(이름붙은 인수 `제거개수`)와는
      다른 모양이다. 거기서는 발동할 때 이미 정해진 수(또는 '잔량전부')를 그대로 받아
      쓰지만, 여기는 '0~3장 중 플레이어가 그때 자유로 고르는 장수'라 정해야 할 수 자체가
      없다 — 선택 개수 상한(«까지»)을 다루는 구조가 따로 필요하다. 추측으로 통로를
      재사용하지 않는다."

"던전마스터 셔플!":
  1:
    미구현: "뒷면 카드 전면 재배치 — 스킬 1번의 「행위자가 뒷면 정체를 보는가」가 진행.md 미해결이라 구현 전에 그 판정이 필요하다."
  2:
    근거: "2. [신속] 필드의 뒷면 표시 몬스터 1장을 앞면 표시로 뒤집는다."
    동작:
      - 표시변경: {대상: 내유닛, 공수: 공격, 이름: "셔플! 2"}
  3:
    근거: "3. 패에서 레벨 5 이상의 몬스터를 특수소환한다."
    동작:
      - 이동: {에서: 패, 로: 유닛존, 수: 1, 조건: {몬스터: true}, 공수: 공격, 이름: "셔플! 3"}
