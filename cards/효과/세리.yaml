# 세리 — 구현 효과 (완성_기준_듀얼.md 2번)
#
# `data/card_pool.json` 의 text 는 표시용이고 여기서 고치지 않는다. 이 파일은 그 텍스트가
# 기계적으로 무슨 결과를 내는지만 다섯 원시 동작(이동·카운터·수치·표시변경·금지)으로 적는다.
# 적을 근거가 없으면 비워 두는 것이 정답이다 — `미구현`(구조가 아직 없음)에 이유를 적는다.
# 추측은 실패다.
#
# **103회차 — 2단계(여덟 덱 확장) 둘째 덱(격투가 다음, 카드 수 순서상 세리).** 자원축 —
# 상대의 메인·상급 덱을 깎아 패배 조건(룰지 4장 b "메인 덱과 상급 덱의 매수가 다 떨어져
# 효과를 처리하지 못하거나, 일반 드로우를 실행할 수 없을 경우")으로 몬다("제외", 공허 존으로
# 보내는 것 — 룰지 0-9, 아카이브와 다른 앞면·공개 존). 승리축 — 상대 덱을 통째로 비우는
# 것 자체가 승리 조건이다(소환세·인지세·이탈세·취득세·세제 등 대부분의 카드가 "덱 맨 위에서
# N장 제외"를 반복한다, `docs/덱_구성_추천.md` 참조).
#
# **이번 회차가 닫은 자리 — 전부 몬스터 카드([소환]·[유언] 키워드), 6개 번호.** 델레가토르·
# 두플리카토르·엑삭토르·릭토르 네 카드의 [유언]("자신의 제외 존에서 카드를 3장 골라 자신의
# 덱으로 되돌리고 발동. 자신의 메인 덱에서 「세리」 몬스터를 1장 특수소환한다")은 네 카드가
# 글자까지 같다 — 공허(목록형 존, 패와 같은 전제로 조건:{} 자유 선택이 되는 공개 존)에서
# 되돌리고 메인덱에서 서치+특수소환하는 기존 두 통로(래빗풋 1의 `조건:{}`, 다크 엠퍼러 1·2의
# `에서:메인덱, 로:유닛존` 서치+특수소환)를 그대로 합친 것뿐, 새 소비 지점 없음. 엑삭토르
# 1번("서로 자신의 덱의 위에서부터 카드를 5장 제외한다")도 다크 엠퍼러 3("상대는 카드를
# 1장 드로우한다")·투기장의 규칙 1("자신은 덱에서 1장 드로우한다")이 이미 연 "소유:나/상대 +
# 조건 없음=블라인드" 통로를 그대로 쓴다 — 목적지만 패 대신 공허다. 치프 세리 3번("자신의
# 묘지에서 3레벨 「세리」 몬스터를 2장 특수소환한다")은 레벨로 좁히는 조건 키가 처음 필요해
# `_조건맞나`(engine/effects.py)에 `레벨` 키를 열고, 발동 가능 판정에 쓸 매수 술어
# `아카이브.카드군매수(카드군, 유형, 레벨)`(engine/predicates.py, `덱.카드군매수()`의
# 아카이브+레벨 버전)을 새로 더했다. 둘 다 다섯 원시 동작 중 어느 것도 늘리지 않는다 —
# `이동`의 `조건` 사전에 선택 키 하나를 더한 것뿐(97·99·100회차와 같은 모양).
#
# **반쪼가리가 아니다 — 자원축의 뼈대(제외·되돌리기·서치)는 닫혔지만, 승리축을 실제로
# 쓰는 카드(소환세·인지세·이탈세·취득세·세 아이라리움·세제, 아래 참조)는 전부 비어
# 있다.** 화면의 "효과있음" 표시가 "이 덱이 완성됐다"는 뜻이 아니다.
#
# **104회차 — 아홉 벽 중 "폴백 소스"(부족하면 다른 덱에서 대신 채워 뺀다) 하나를 열고
# 세제 2·3번을 닫았다.** `이동`(「에서·로」 블라인드 모드)에 선택 키 `부족시: {에서: <존>}`
# 를 새로 더했다(`engine/effects.py` 모듈 docstring '## 폴백 소스' 절, 여섯 번째 원시
# 동작이 아니다 — `이동`의 선택 키 하나). 세제 2·3은 가해자 축이 안 걸려 있어 이 키
# 하나로 바로 닫혔지만, 소환세 2·인지세 2·이탈세 3·취득세 2는 폴백 소스가 열려도
# **가해자 축**("상대에 의해")이 그대로 남아 여전히 `미구현`이다(아래 절 참조) — 두 벽이
# 겹쳐 있던 네 번호 중 하나만 풀린 것뿐이지 반쪼가리로 닫은 건 없다(걸린 벽이 둘 다 없는
# 세제만 닫았다). `scripts/효과검증.py` 구현 90→**92**, 빈자리 56→**54**(세제 2→0).
#
# ## 이번 회차가 못 닫은 자리 — 왜 비었는지 (같은 벽끼리 묶음)
#
#   - **코스트의 "납부자"·"매수" 자체를 바꾸는 효과** — 델레가토르 1("코스트는 상대가
#     대신 지불한다"), 두플리카토르 1("코스트로 지불해야 하는 카드의 매수는 2배가 된다",
#     룰지 원본 "h. 세리 - 두플리카토르 관련 재정" 참조 — 그 재정은 "이 카드만 지정한
#     코스트는 이 카드 1장으로 취급"이라는 **적용 범위**를 정할 뿐, 매수를 실제로 2배로
#     만드는 엔진 통로는 여전히 없다), 세 - 아이라리움 2("「세리」 몬스터 [유언]의 코스트
#     매수는 1장이 된다", 같은 축의 반대 방향). `cards/효과/*.yaml` 전체에 코스트의
#     납부자나 매수 자체를 바꾸는 선례가 0건이다(세금차감은 금액 누적일 뿐 납부자·배율을
#     안 바꾼다) — 새 구조 필요, 다섯 동작 밖.
#   - **"상대에 의해 자신의 묘지로 보내진 경우"(가해자 축)** — 소환세 2, 인지세 2, 이탈세
#     3, 취득세 2(넷 다 글자까지 같다). 기존 사건 반응 창 6개(소환직후·효과소환직후·
#     유언직후·필드이탈직후·전투파괴직후·자신몬스터전투파괴직후, engine/predicates.py)
#     중 어느 것도 "누가 보냈는가"를 안 본다 — 가장 가까운 `필드이탈직후()`도 목적지만
#     가리지 않을 뿐 가해자 축이 없다.
#   - **"부족하면 다른 덱에서 대신 채워 뺀다"(폴백 소스) — 104회차가 닫았다.** `이동`에
#     `부족시: {에서: <존>}` 키를 더해 세제 2·3("제외할 카드가 부족할 경우, 부족한
#     매수만큼을 상급 덱/메인 덱의 위에서부터 대신 제외한다")을 닫았다(`engine/
#     effects.py` 모듈 docstring '## 폴백 소스' 절). **소환세 2·인지세 2·이탈세 3·취득세
#     2는 같은 절이 있어도 그대로 `미구현`이다** — 이 네 카드는 폴백 소스와 아래 가해자
#     축이 겹쳐 있는데, 가해자 축이 아직 없어 발동조건 자체가 안 열리므로 `부족시`까지
#     갈 일이 없다(발동 후보가 안 뜨면 `동작`은 아예 평가되지 않는다).
#   - **"효과를 치환한다"(효과 간섭 모델)** — 이탈세 2("그 효과를 「…」로 변경한다").
#     `분기`(92회차)는 상태조건에 따라 **이미 적힌** 동작 중 하나를 고르는 순수 제어일
#     뿐, 상대 효과의 문장 자체를 다른 문장으로 바꿔 적용하는 모델이 아니다 — `docs/
#     듀얼_점검.md` 「알려진 틈」이 이미 "효과 치환(암흑의 율법·공유존 카드)"을 별개 벽으로
#     적어 둔 바로 그 자리다.
#   - **"서로가 X할 때마다"(아무 쪽이든, 즉시 반응하는 전역 트리거)** — 취득세 1, 세 -
#     아이라리움 1, 세제 1(셋 다 "서로가 특수소환/드로우·서치/효과발동 할 때마다"). 턴종료
#     자동 훅(93회차)은 "턴 끝에 한 번" 평가라 다르고, 기존 사건 반응 창 6개는 전부 "카드
#     자신에게 일어난 사건"만 본다 — 이건 "아무 플레이어가 그 행동을 할 때마다 즉시"라 더
#     넓은 새 트리거 종류가 필요하다.
#   - **이종 결과를 상대가 그때 자유로 고름 + 체인 반응** — 인지세 1("상대는 … 제외하거나
#     그 카드를 무효로 한다", 선택 주체가 **상대**라는 점만 빼면 격투가 입장 1의 「A하거나
#     B한다」 벽과 같다). "상대가 카드의 발동을 선언했을 때"(체인에 끼어드는 반응)도 기존
#     `체인에상대효과있음()`류와는 "무효화할지 말지를 상대가 그때 고른다"는 점에서 다시
#     한 벽을 더 얹는다.
#   - **체인할 수 없다(기존 벽)** — 이탈세 4("상대의 덱의 위에서부터 카드를 10장 제외한다.
#     이 효과에 상대는 체인할 수 없다"). 제외 자체는 다섯 동작으로 되지만 뒷문장이 체인
#     무효화 모델(호박옥 황금봉랍 1·던전마스터 망령 1과 같은, 이미 알려진 벽)을 요구해
#     반쪼가리를 피해 카드 전체를 비웠다.
#   - **"동시에 발동할 수 없다"(카드 자신의 두 효과 간 상호 배제 선언)** — 이탈세 1("이
#     카드의 3·4번 효과는 동시에 발동할 수 없다"). 이건 결과를 내는 효과가 아니라 발동
#     조건끼리의 제약 선언이라 `동작`에 적을 내용이 없다 — 1층(`cards/발동조건/`)에서
#     "3번을 턴에 썼으면 4번을 못 쓴다" 같은 식으로 걸어야 하는데, 지금까지 "같은 카드의
#     다른 번호 효과 사용 여부"를 조건으로 묻는 선례가 없다(`효과사용횟수()`는 같은 번호의
#     반복만 본다) — 새 축, 다음 회차 후보.
#   - **[제약] 대체 소환 비용(일반소환 조건 자체를 바꾸는 키워드)** — 치프 세리 1("이
#     카드는 자신의 묘지에서 3레벨 「세리」 몬스터를 3장 제외하는 것으로 일반소환할 수
#     있다"). `data/card_pool.json` 전수 검색으로 [제약] 키워드를 쓰는 카드가 데이터버그·
#     세리·소원의분수·솔루나(전부 아직 안 연 덱)에만 있고 호박옥·던전마스터·격투가에는
#     0건임을 확인했다 — 이 키워드 자체가 이번이 첫 등장이라 `engine/legalmoves.py`·
#     `engine/deck.py`의 일반소환 생성 경로 어디에도 "대체 비용으로 일반소환" 통로가 없다.
#     추측으로 다섯 동작에 끼워 맞추지 않는다.
#   - **"전부"(목록형 존 자체를 비우기 + 비운 매수를 뒤 문장이 다시 쓴다)** — 치프 세리
#     2("자신의 제외 존의 카드를 전부 자신의 덱으로 되돌리고 발동. 되돌린 매수만큼 상대의
#     덱의 위에서부터 카드를 제외한다"). `이동`의 `전체: true`(86회차)는 **필드형** 대상
#     말(`대상: 모든유닛` 등)에만 있고, 공허처럼 `에서`로 가리키는 **목록형 존**에는 "전부"
#     분기가 없다(지금은 정확한 매수를 `수`로 미리 알아야 한다) — 설령 "전부"를 목록형
#     존에도 열더라도, 그렇게 옮긴 매수를 **뒤따르는 다른 이동의 `수`로 내보내는 통로**도
#     없다(`부족이름`은 "카운터 분배"에서만 되쓴다, 이동에는 아직 그런 출력 자리가 없다).
#     둘 다 새 소비 지점이 필요해 이번 회차 범위 밖으로 비웠다.
#   - **키워드없음 마법 카드가 발동 뒤 어디로 가는지(효과존에 남는지, 1회용으로
#     아카이브에 가는지)** — 소환세 1("자신의 메인 덱에서 「세리」 몬스터를 1장 골라
#     자신의 패에 넣는다"). [신속]·[트리거] 마법은 황금봉랍류가 "패.있음() or
#     이펙트존.있음()" 선례를 세워 뒀지만, **키워드없음** 마법 카드가 발동한 뒤 카드
#     자신이 어떻게 되는지는 기존 두 덱에도 선례가 없다 — `호박옥 - 침전` 1번이 같은
#     모양(키워드없음 마법, `cards/효과/호박옥.yaml`엔 `동작`이 있지만 `cards/발동조건/
#     호박옥.yaml`엔 그 카드 자체가 아예 없다)으로 똑같이 멈춰 있는 걸 확인했다 — 이미
#     있는 미해결 자리이지 이 회차가 새로 만든 벽이 아니다. 추측으로 "효과존에 남는다"를
#     정하지 않는다.
#
# 「A 또는 B」(소환세 2 등의 가해자 축과 폴백 소스가 겹친 경우) 외엔 전부 단일 벽이다 —
# 겹친 자리는 위에서 두 번 적었다(예: 소환세 2는 가해자 축 + 폴백 소스 둘 다 걸린다).

"세리 - 델레가토르":
  1:
    미구현: "1. [지속] 이 카드가 필드에 앞면 표시로 존재하는 한, 자신이 카드의 발동을
      위해 지불해야 하는 코스트는 상대가 대신 지불한다. (이 효과는 1턴에 1번 제약을
      받지 않는다.) — 코스트의 '납부자' 자체를 바꾸는 효과. `cards/효과/*.yaml` 전체에
      선례 0건(머리 주석 「코스트의 납부자·매수」 절 참조) — 새 구조 필요."
  2:
    근거: "2. [유언] 자신의 제외 존에서 카드를 3장 골라 자신의 덱으로 되돌리고 발동.
