# 호박옥 · 봉인의 계약 — 구현 효과 (완성_기준_듀얼.md 2번)
#
# `data/card_pool.json` 의 text 는 표시용이고 여기서 고치지 않는다. 이 파일은 그 텍스트가
# 기계적으로 무슨 결과를 내는지만 다섯 원시 동작(이동·카운터·수치·표시변경·금지)으로 적는다.
# 적을 근거가 없으면 비워 두는 것이 정답이다 — `미구현`(구조가 아직 없음) 또는
# `미해결`(룰 질문이 안 닫힘)에 이유를 적는다. 추측은 실패다.
#
# 반복해서 나오는 미구현 사유 네 가지:
#   (가) [지속] 상시 효과 — 발동이 아니라 "필드에 있는 한 계속 적용"이다(2026-10-26 사용자
#        판정). 발동 후보로 뜨지도 않고, 상시 효과 적용 모델이 따로 필요하다.
#        **91회차 — "자기 자신을 스스로 보호하는" 모양의 모델을 열었다.** `지속조건:`
#        키(식 언어)를 번호 항목에 적으면 `engine/effects.py` `지속효과_평가()`가 매번
#        다시 평가해 `동작:`의 `금지:` 항목이 거는 제약을 지금 켜진 것만 돌려준다 —
#        `resolve.금지()`를 거치지 않으므로 `대상`·`기간`이 필요 없다(여섯 번째 원시
#        동작은 아니다, `금지`를 읽기만 하는 길이 하나 늘었을 뿐). 같은 회차가 **그동안
#        아무도 안 읽던** 기존 `금지:` 이름표(마르모르 3 · 반혼체 1 · 임시 봉인, `resolve.
#        금지()`가 쓰기만 하고 소비하는 코드가 0곳이었다)도 다섯 자리(공격·표시변경·
#        효과대상·전투파괴·무효)에 소비 코드를 달아 실제로 작동하게 했다 — 이 셋은
#        "구현"으로 세어져 있었지만 91회차 전까지는 조용히 안 먹혔다(과대 보고였던 자리를
#        고쳤다, 새 기능이 아니라 버그 수정).
#        **범위 — 자기 보호만.** "이 카드는 …" 꼴(아우렘 티라누스 3번)만 연다. "카운터가
#        놓인 **자신의 몬스터**는…"(태고의 수해 2번)처럼 한 카드가 **다른 카드들**을
#        보호하는 필드 전역 모양, "각 턴 종료 시"처럼 턴 종료 훅이 필요한 모양(태고의 수해
#        1번 · 봉인의 계약 2·3번), "직접공격 허용 예외"처럼 전투 규칙 자체를 바꾸는 모양
#        (녹스 솜니페르 3번)은 범위 밖 — 전부 자기 보호와 다른 구조라 추측으로 같이 안
#        열었다. 세 제약이 전부 안 막히는 카드(아우렘 티라누스 3번)만 91회차에 닫았다.
#        **92회차 — 릴리스도 이제 막을 수 있다.** "릴리스를 코스트로 쓰는" 자리가 코드에
#        마르모르·카르분쿨루스 1번[신속] 둘뿐이었고, 둘 다 "릴리스 ↔ 카운터 3개 대체 비용"
#        (조건부 코스트 분기, 어느 쪽을 낼지가 선택)에 막혀 그 코스트 동작 자체가 코드에
#        없었다 — 이번 회차가 `효과적용기`에 **여섯 번째 원시 동작이 아닌** `분기` 메타 키
#        (상태를 안 바꾸고 기존 다섯 중 어느 쪽을 돌릴지만 고른다, `engine/effects.py`
#        모듈 docstring "## 코스트 분기" 참조)와 새 대상 말 `릴리스가능유닛`을 더해 두 카드의
#        코스트를 실제로 적었다. `릴리스가능유닛`이 `금지됨(..., "릴리스")`도 같이 거르게
#        해서 "릴리스 불가" 금지가 드디어 소비 지점을 얻었다 — 카르분쿨루스 2번(제약이
#        릴리스 불가·상대 효과 대상 불가 둘뿐이라 둘 다 닫히는 카드)이 그걸로 같이 닫혔다.
#        **아우렘 티라누스 2번 · 마르모르 2번 · 녹스 솜니페르 2번은 릴리스와는 다른 제약
#        (예외 있는 면역 · 비대상 효과 면역)이 따로 막혀 있어 92회차까지 그대로 미구현이었다.**
#        **95회차 — "예외 있는 면역" 갈래를 열었다.** 아우렘 티라누스 2번·녹스 솜니페르
#        2번은 글자가 완전히 같은 카드였음을 `data/card_pool.json` 대조로 다시 확인하고
#        `금지:효과대상` 사전에 선택 키 `제외:`(조건이 맞는 카드가 거는 효과만 예외로
#        통과시킨다)를 더해 둘 다 같이 닫았다(`engine/effects.py` 모듈 docstring "## 예외
#        있는 면역" 참조). **마르모르 2번("비대상 효과 면역")은 글자가 다른 별개 갈래라
#        같이 안 열었다** — 추측으로 묶지 않는다, 그대로 미구현.
#        **93회차 — "턴 종료 시" 자동 적용(턴 종료 훅)을 열었다.** `동작` 항목에
#        `턴종료: {범위: 매턴|자신턴}`을 더해 적으면 `engine/turn.py` `종료단계()`가 턴이
#        끝날 때마다 발동 선언 없이 그 `동작:`을 그대로 돈다(새 함수 `턴종료효과_후보들()`·
#        `턴종료효과_처리()`, `engine/effects.py` 모듈 docstring "## 턴 종료 훅" 참조) —
#        이걸로 **태고의 수해 1번**을 닫았다. **봉인의 계약·몽식의 계약 2번은 훅이 생겨도
#        여전히 미구현** — "제거하지 못한 만큼 대미지로 바뀌는" 부분 제거 + 부족분 계산이
#        기존 `카운터` 분배 제거(all-or-nothing)와 다른 구조라 따로 막혀 있다(각 항목
#        참조).
#        **94회차 — (c) 필드 전역 보호를 열고 태고의 수해 2번을 닫았다.** `지속효과_평가()`가
#        "카드 자기 자신"만 보던 것에, `금지` 동작이 `대상`(순수 영역 토큰)·`대상조건`(식
#        언어, 후보 카드 관점)을 받을 수 있게 해 다른 카드들에 번지는 보호도 적을 수 있게
#        됐다(`engine/effects.py` 모듈 docstring "## 필드 전역 보호" · `_필드전역금지()`
#        참조) — 여섯 번째 원시 동작이 아니라 다섯 번째(금지)의 사전을 넓힌 것뿐이다.
#        「알려진 틈」 3번([지속] 상시 효과)이 이걸로 열었던 세 조각((a)·(b)·(c)) 전부 닫혔다.
#   (나) 강제 트리거 — 플레이어가 고르는 수가 아니다(2026-10-27 판정 #4). 턴 전이 엔진이
#        자동으로 걸어야 하는데 트리거 처리가 아직 없다.
#   (다) 가변 개수 — "임의의 개수만큼 제거하고 제거한 개수까지" 꼴. **82회차에 닫혔다** —
#        합법수 문자열의 `제거개수=` 가 `효과적용기` 까지 가는 통로가 생겼다
#        (`engine/effects.py` 「이름붙은 인수」 절). 아우렘 티라누스 4번 · 균열 1번이 이걸로
#        채워졌다.
#   (라) 반응형 트리거 — "상대가 ~했을 때"의 타이밍 훅이 아직 없다. **85회차 — 강제 [트리거]
#        마법 넷의 첫 장(깨어남의 종)을 닫았다.** (나) 강제와 (다) 가변 개수가 겹쳐 막혀
#        있었는데, `engine/legalmoves.py` `강제효과_후보들()`이 YAML `인수:` 사전을 읽어
#        `효과적용`에 그대로 넘기는 통로를 새로 열어 "플레이어가 안 고르고 늘 '전부'로 정해진"
#        이름붙은 인수도 강제 효과에서 쓸 수 있게 됐다 — `cards/발동조건/호박옥.yaml` 참조.
#        **86회차 — 꿈의 파열도 닫았다.** "필드에서 벗어났을 때"(재정 호박옥6 — 가는 곳을
#        안 가린다)는 `engine/resolve.py`의 새 「필드이탈됨」 턴표지(목적지 불문)와
#        `engine/predicates.py` `필드이탈직후()`로, "필드의 모든 몬스터를 파괴"는 `이동`의
#        새 `전체: true`(「모든유닛」 대상 말, 고르지 않고 전부 적용)로 풀었다. 월식 · 몽마의
#        도래는 그대로 남았다(각각 카운터 **합계** 임계값 + 분배 제거 · 전투 파괴자 귀속이
#        더 필요하다, `docs/듀얼_점검.md` 「알려진 틈」).
#        **87회차 — 월식도 닫았다.** 카운터 합계 임계값은 새 술어
#        `engine/predicates.py` `필드_카드군카운터합('호박옥')`으로 — 처음에는 기존
#        `필드_카운터합()`(카드군을 안 가린다)으로 충분한 줄 알았으나, 자동 대전 500판
#        탐색으로 틀렸음이 드러났다: `호박옥 - 결정충`·`잔편`·`수액정` 2번처럼 "자신 필드의
#        몬스터"(카드군 제한 없음)로 적힌 형제 효과 때문에 호박옥 덱에 같이 들어간 `공용`
#        몬스터(그룹 없음)에도 봉인 카운터가 실제로 쌓이는 판이 나왔다 — 월식은 카드
#        텍스트가 "「호박옥」 몬스터"로 좁혀 적어서 둘이 실제로 다르다(`cards/발동조건/
#        호박옥.yaml` 월식 항목 근거 참조). "5개를 분배해서 제거"는 `카운터`의 새
#        `증감: {제거: N, 분배: true}` + `조건: {카드군: 호박옥}`(후보를 카드군으로 좁히고
#        여러 장에 걸쳐 1개씩 반복 제거)로, "상대 필드의 모든 몬스터를 뒷면 수비 표시로"는
#        `표시변경`의 새 `전체: true`(86회차가 `이동`에 연 것과 같은 모양, 이쪽은 카드군
#        제한이 없어 `조건`을 안 쓴다)로 풀었다. 몽마의 도래는 전투 파괴자 귀속이
#        `진행.md` 「미해결」에 남아 그대로다.
#        **88회차 — 강제 [트리거] 넷과는 다른 조각, "임의(선택) [트리거]가 상대 턴에도
#        반응할 자리"를 열었다.** 53회차가 1층 발동 조건(`체인에상대효과있음()`)까지는
#        열어 뒀지만, `scripts/듀얼.py`·`engine/room.py`의 턴 루프가 **턴 플레이어만**
#        물어서(`합법수_생성(... 상태.턴플레이어)`) 상대는 자기 턴이 아닐 때 이 자리를
#        한 번도 못 받고 있었다 — 레시나·실렉스 3번("상대가 효과를 발동했을 때")이 그
#        전형이다. `engine/turn.py` `반응형트리거_기회()`를 새로 세워 모든 "발동"
#        (`수_적용`·`강제트리거_처리` 둘 다) 뒤에 발동자의 상대에게 `트리거반응_후보들()`
#        (`engine/legalmoves.py`, 키워드가 정확히 `트리거`이고 강제가 아닌 것만)로 한 번
#        묻는다 — 새 역할 인터페이스를 안 만들고 메인 루프가 이미 쓰는 `수_고르기()`를
#        그대로 재사용했다. 레시나 3번을 이걸로 닫았다("필드의 몬스터에게 봉인 카운터를
#        2개" → `카운터: {대상: 모든유닛, 증감: 2}`, 새 동작 확장 없이 기존 `모든유닛`
#        대상 말 그대로). **실렉스 3번은 타이밍 훅은 같이 열렸지만 결과 쪽("덱/묘지에서")이
#        던전마스터 컨트롤러 1번과 같은 "출처를 고르는 이동" 벽에 막혀 그대로 미구현이다**
#        (실렉스 3번 항목·`cards/효과/던전마스터.yaml` 컨트롤러 1번 참조, 89회차가 닫았다).
#        **90회차 — 던전마스터 "상대가 몬스터를 소환했을 때"(다크나이트 1 · 트랩: 가시바늘
#        1)도 같은 반응 기회 메커니즘으로 닫았다.** 새 사건 술어 `상대몬스터소환직후()`
#        (engine/predicates.py)와 새 체인 분류 `"소환"`(engine/turn.py `_소환()`)으로
#        열었다 — 자세한 근거는 `cards/발동조건/던전마스터.yaml` 90회차 항목 참조. 범위는
#        일반 소환만이다(효과 소환은 반응 창을 열 통로가 아직 없다 — 다음 조각이 아니라
#        더 큰 별개 구조 벽, `engine/predicates.py` `상대몬스터소환직후()` docstring 참조).

"호박옥 - 아우렘 티라누스":
  1:
    근거: "1. [소환] 이 카드에 봉인 카운터를 3개 놓는다."
    동작:
      - 카운터: {대상: 자신, 증감: 3}
  2:
    근거: "2. [지속] 이 카드에 봉인 카운터가 놓여 있는 한, 이 카드는 「호박옥」 카드 이외의
      카드의 효과를 받지 않고, 전투로는 파괴되지 않으며, 릴리스되지 않는다. (이 효과는
      1턴에 1번 제약을 받지 않는다.) — (95회차, 「알려진 틈」 3번 남은 미구현 — '예외 있는
      면역', 엔진 쪽 설계는 `engine/effects.py` 모듈 docstring '## 예외 있는 면역' 참조.
      `data/card_pool.json` 대조로 녹스 솜니페르 2번과 글자가 완전히 같음을 확인했다 —
      같은 근거다.) 전투 내성·릴리스 불가는 91·92회차가 이미 연 소비 지점을 그대로 쓴다
      (둘 다 예외가 없는 제약이라 손 안 댔다). '「호박옥」 카드 이외' 예외는 `금지:효과대상`
      사전에 새 선택 키 `제외: {테마: 호박옥}`을 더해 적는다 — `_효과대상금지제외()`가
      '지금 이 효과를 거는 카드'(`자신`)를 받아 그 카드가 호박옥 테마면 이 금지 하나만
      건너뛴다(다른 두 금지는 그대로 유지)."
    지속조건: "자기카운터수() > 0"
    동작:
