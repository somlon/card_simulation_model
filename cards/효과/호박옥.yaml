    # 2026-10-28 사용자 판정 — "파괴한 몬스터" = 상대가 전투로 파괴한 **자신의 「호박옥」
    # 몬스터**(목적어 읽기)다. 공격해 온 상대 몬스터가 아니다. 사용자가 반대 읽기의
    # 귀결(아래)을 듣고 그대로 확정했다. 이 판정의 결과로 **구현 대상이 아니다** —
    # 추측으로 못 적는 것이 아니라, 룰지상 적용할 자리가 없다:
    #   · 트리거가 "파괴했을 **때**"라 발동 시점에 그 호박옥 몬스터는 이미 아카이브에 있다
    #   · 룰지 0-3(:100) "아카이브의 카드는 앞면으로 쌓이며" — 아카이브에 뒷면 상태가 없다
    #   · 룰지 1-2(:185) "유닛을 뒷면으로 하는 효과"·(:166~169) 뒷면 유닛 규정은 전부
    #     **필드의 유닛**을 전제한다
    # 그래서 대상이 존재하지 않아 늘 불발이고, 상태를 바꿀 동작이 없다. 강제 발동이므로
    # 합법수가 아니라 `커버하지_않음` 에서도 세지 않는다(2026-10-27 판정과 같은 취급).
    미구현: "(나) 강제 트리거 — 2026-10-28 사용자 판정으로 「파괴한 몬스터」 = 파괴당한 자신의
      「호박옥」 몬스터. 발동 시점에 이미 아카이브에 있고 아카이브엔 뒷면이 없어(룰지 0-3)
      적용할 대상이 없다 — 늘 불발. 구현 대상 아님(범위 밖)."

