  1:
    미구현: "1. [전투] 자신 필드의 「격투가」 몬스터 1장을 대상으로 하고 발동. 그 카드는
      1회 더 공격할 수 있으며, 다음의 효과를 얻는다. - [전투] 필드의 카드 1장을 대상으로
      하고 발동. 상대에게 1000 대미지를 주고, 그 카드를 파괴한다. — [전투] 키워드 게이트
      자체는 102회차가 열었다(모듈 머리글 참조, `자신몬스터전투파괴직후()`로 이 카드
      자신의 [전투]는 닫을 수 있다). 그래도 남은 두 겹 벽이 그대로다 — '1회 더 공격' 새
      메커니즘, '다음의 효과를 얻는다'(다른 카드에 새 발동 가능 효과를 부여하는 꼴 —
      재정 [격투가 2](G3) '세레모니가 준 [전투]의 1턴 1번 단위는 부여마다 별개 횟수'가
      이게 실제로 작동하는 메커니즘임을 재확인해 준다). 추측으로 둘 중 하나만 반쪼가리로
      만들지 않는다."

"격투가 입장":
  1:
    미구현: "1. [신속] 덱에서 「격투가」 몬스터를 1장 패에 넣거나 특수소환한다. 이 효과로
      특수소환한 몬스터는 이 턴에 상대의 효과를 받지 않는다. — 모듈 머리글 「A하거나
      B한다」 참조. 뒤 문장(턴 한정 면역, 금지:효과대상+기간:턴종료로 닫을 수 있는 모양)은
      앞 문장의 선택 구조가 없어 같이 비운다(반쪼가리 금지)."
  2:
    미구현: "2. [트리거] 자신의 「격투가」 카드가 파괴되었을 때, 묘지의 이 카드를 제외하고
      발동한다. 덱에서 「격투가」 카드를 1장 패에 넣는다. — 모듈 머리글 「사건 반응 창」
      참조."

"격투가 반격":
  1:
    미구현: "1. [트리거] 필드에 「격투가」 카드가 존재할 때, 상대가 효과를 발동하면 발동.
      그 효과를 무효로 한다. — 호박옥 황금봉랍 1번·던전마스터 망령 1번과 같은 체인
      무효화 모델이 없다(「알려진 틈」, docs/듀얼_점검.md). 범위 밖(기존 벽과 동일)."

"격투가의 투기장":
  1:
    미구현: "1. [지속] 상대 필드의 몬스터는 수비 표시로 존재할 수 없다. 상대 필드에
      몬스터가 존재할 경우, 상대는 반드시 공격해야 한다. (1턴 1번 제약 없음.) — 둘째
      문장이 모듈 머리글 「반드시 공격해야 한다」의 새 메커니즘이다. 첫째 문장만 금지
      (표시변경)로 반쪼가리를 만들면 카드 전체를 '구현'으로 잘못 보고하게 되어(91·92회차
      '과대 보고 금지' 원칙) 카드 전체를 비운다."
  2:
    미구현: "2. [신속] 자신 필드에 몬스터가 존재하지 않을 때 발동. 덱에서 「격투가」
      몬스터 1장을 패에 넣거나 특수소환한다. — 격투가 입장 1번과 같은 「A하거나 B한다」
      구조 없음."
  3:
    미구현: "3. [트리거] 상대 필드의 몬스터가 파괴되었을 경우 발동. 덱에서 「격투가」
      카드 1장을 패에 넣는다. (이 효과로 동명의 카드를 패에 넣을 수 있다.) — 격투가
      입장 2번과 같은 「사건 반응 창」 없음."

"투기장의 규칙":
  1:
    근거: "1. [전투] 자신은 덱에서 1장 드로우한다. — 102회차, [전투] 키워드 게이트 신설로
      닫았다(모듈 머리글 참조). 스킬 카드라 재정 2차 Q6의 '자신 몬스터가'(아무 몬스터든)
      쪽 — `자신몬스터전투파괴직후()`를 쓴다(`cards/발동조건/격투가.yaml` 참조). '조건
      없음=블라인드 드로우'는 격투가 래빗 풋 1번 머리 주석이 이미 세운 전례, 던전마스터
      컨트롤러 3번(`cards/효과/던전마스터.yaml:169`)과 같은 모양이다."
    동작:
      - 이동: {에서: 메인덱, 로: 패, 수: 1, 이름: "투기장의 규칙 1"}
  2:
    근거: "2. [신속] 자신 패의 「격투가」 카드를 1장 덱으로 되돌린다. 덱에서 「격투가」
      카드를 1장 패에 넣는다."
    동작:
      - 이동: {에서: 패, 로: 메인덱, 수: 1, 조건: {테마: 격투가}, 이름: "투기장의 규칙 2 되돌리기"}
      - 이동: {에서: 메인덱, 로: 패, 수: 1, 조건: {테마: 격투가}, 이름: "투기장의 규칙 2 서치"}
  3:
    미구현: "3. 자신 패의 「격투가」 카드를 원하는 수까지 덱으로 되돌린다. 그 수만큼
      덱에서 카드를 드로우한다. — 모듈 머리글 「원하는 수까지」 참조(던전마스터 트랩
      리페어 시스템 1번과 같은 벽)."
