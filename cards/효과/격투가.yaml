# ## [전투] 키워드 — 102회차가 게이트를 열었다
#
# 룰지 5장: "[전투] (조건) 전투로 카드를 파괴했을 때." 재정 2차 Q6(`rules/원본/
# 재정_질문_답변_정리_2026-10-24.txt`)이 몬스터가 아닌 카드(세레모니·투기장의 규칙 1번)에
# 붙어도 "자신 몬스터가 전투로 카드를 파괴했을 때"로 읽는다고 확정해 뜻은 분명하다.
# **102회차 — `_발동조건_타이밍통과`(engine/legalmoves.py)에 `전투` 키워드를 더하고(신속·
# 소환·유언과 같이 항상 통과, 진짜 게이트는 조건식), `engine/turn.py` `_전투()`가 전투에서
# "파괴한" 쪽의 턴표지에 "전투로파괴함"을 켜고(카드 자신 + 플레이어 둘 다, 종료단계에서
# 양쪽 다 닫음), `engine/predicates.py`에 두 술어를 새로 열었다 — `전투파괴직후(카드)`
# (몬스터 자기 참조, 필드에 남아 있어야 참) · `자신몬스터전투파괴직후()`(비몬스터 카드용,
# 재정 2차 Q6의 "자신 몬스터가" — 아무 몬스터든).** 엘리펀트 노즈 2·라이노 혼 2·투기장의
# 규칙 1은 이 벽 하나만 막고 있어서 닫혔다. **타이거팽 2·라이온하트 2는 그대로 미구현이다**
# — '1회 더 공격할 수 있다'가 다섯 원시 동작 밖의 별개 메커니즘이라 이번 회차의 범위
# 밖이다(아래 「반복해서 나오는 다른 미구현 사유」 참조). 세레모니 1도 그대로 미구현이다
# (아래 참조, '1회 더 공격' + '효과를 얻는다' 둘 다 남음).
#
# ## 반복해서 나오는 다른 미구현 사유
#
#   - **"1회 더 공격할 수 있다"** — 턴당 공격 1회 제한(`카드인스턴스.턴표지`의
#     `"공격선언함"`, engine/legalmoves.py)을 효과로 풀어 주는 길이 없다. 효과 YAML이
#     건드릴 수 있는 자리가 다섯 원시 동작뿐이고 턴표지는 그 밖이라 새 메커니즘이 필요하다.
#   - **"A하거나 B한다"(이종 결과를 플레이어가 자유로 고름)** — 기존 `분기`(92회차)는
#     게임 상태 조건에 따라 **결정되는** 대체(마르모르 1번 "릴리스 가능하면 릴리스, 아니면
#     카운터")일 뿐이다. 격투가 입장 1번·격투가의 투기장 2번의 "패에 넣거나 특수소환한다"는
#     플레이어가 매번 자유로 고르는 것이라 다른 구조가 필요하다.
#   - **"자신(상대) 카드가 파괴되었을 때"(사건 반응 창)** — 지금 있는 사건 반응 창은
#     "상대가 몬스터를 소환했을 때"(90회차, `상대몬스터소환직후()`) 하나뿐이다. "파괴되었을
#     때"는 다른 사건이라 새 술어가 필요하다(격투가 입장 2번·격투가의 투기장 3번).
#   - **"원하는 수까지"(가변 상한, 플레이어가 그때 자유로 고르는 장수)** — 던전마스터
#     트랩 리페어 시스템 1번과 같은 벽(투기장의 규칙 3번).
#   - **"반드시 공격해야 한다"(강제 행동)** — 합법수에서 "공격 안 함"을 지우는 새 메커니즘
#     (격투가의 투기장 1번, 둘째 문장).
#   - **"다음의 효과를 얻는다"(다른 카드에 새 발동 가능 효과를 얹음)** — 다섯 원시 동작
#     밖의 효과-부여 모델(격투가 세레모니 1번).

