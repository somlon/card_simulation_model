<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴네오유희왕 덱 등록</title>
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#1E2733;--mute:#66717F;--line:#D5DBE2;--acc:#3B4BA8;--bad:#B3261E;--warn:#8A5A00;
--c-적:#C8372D;--c-녹:#3E8E4E;--c-황:#D9A520;--c-청:#2F6DB5;--c-자:#7A4BA0;--c-백:#C9CED4;--c-흑:#2B2B2B;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{padding:18px 24px 12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:20px;margin:0 16px 0 0;font-weight:700}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
input,select,textarea,button{font:inherit;color:inherit}
input,select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:200px}
button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)} button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.colorbar{flex:1 1 260px;min-width:240px}
.colorbar .bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--line)}
.colorbar .bar span{display:block;height:100%}
.colorbar .legend{font-size:12px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;padding:16px 24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input{flex:1 1 160px;min-width:0}.filters select{min-width:0}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #EDF0F3}
.row .chip{align-self:stretch;border-radius:2px}
.row .nm{min-width:0;cursor:pointer}
.row .nm b{font-weight:600}
.row .meta{font-size:12px;color:var(--mute)}
.row .act{display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.row .act button{padding:2px 8px}
.row.off{opacity:.38}
.qty{min-width:22px;text-align:center;font-weight:700}
.deckpart{margin-bottom:14px}
.deckpart h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between}
.deckpart h3 span{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:400}
.deckpart h3 span.bad{color:var(--bad);font-weight:700}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
#msgs li{font-size:13px;padding:3px 0}#msgs .e{color:var(--bad)}#msgs .w{color:var(--warn)}#msgs .ok{color:var(--c-녹);font-weight:600}
#detail{white-space:pre-wrap;font-size:13px;background:#F6F8FA;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:10px;max-height:260px;overflow:auto}
#out{width:100%;min-height:160px;font:13px/1.45 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.poolwrap{max-height:70vh;overflow:auto}
</style></head><body>
<header>
  <h1>덱 등록</h1>
  <label>덱 이름<input id="dname" placeholder="예: 번성충 대발생 기본형"></label>
  <label>스킬 카드<select id="skill"></select></label>
  <div class="colorbar"><div class="bar" id="cbar"></div><div class="legend" id="clegend">메인·상급 덱의 색 분포</div></div>
</header>
<main>
<section>
  <h2>카드 풀 <small id="poolcount"></small></h2>
  <div class="filters">
    <input id="q" placeholder="카드명·번호·효과 검색">
    <select id="ftype"><option value="">모든 종류</option><option>몬스터</option><option>마법</option><option>필드</option></select>
    <select id="fdeck"><option value="">메인·상급</option><option>메인</option><option>상급</option></select>
    <select id="fshow"><option value="ok">사용 가능 카드만</option><option value="all">전체 보기</option></select>
  </div>
  <div class="poolwrap"><ul id="pool"></ul></div>
  <div id="detail">카드 이름을 누르면 효과가 여기에 표시됩니다.</div>
</section>
<section>
  <h2>덱 <small id="deckcount"></small></h2>
  <div id="deck"></div>
  <h2>검사 결과</h2>
  <ul id="msgs"></ul>
  <h2 style="margin-top:14px">덱 파일</h2>
  <div class="tools">
    <button class="primary" id="copy">복사</button>
    <button id="dl">.deck 파일 저장</button>
    <button id="imp">아래 텍스트 불러오기</button>
    <button id="clear">덱 비우기</button>
  </div>
  <textarea id="out" spellcheck="false"></textarea>
</section>
</main>

t": "1. [지속] 이 카드가 필드에 앞면 표시로 존재하는 한, 자신 필드의 다른 카드들은 상대의 효과를 받지 않는다. (이 효과는 1턴에 1번 제약을 받지 않는다.)\n2. [유언] 자신의 제외 존에서 카드를 3장 골라 자신의 덱으로 되돌리고 발동. 자신의 메인 덱에서 「세리」 몬스터를 1장 특수소환한다.", "type": "몬스터", "level": 3, "race": "인간", "attr": "어둠", "atk": "1100", "deck": "메인", "def": "1400", "tags": ["세리"], "groups": ["세리"]}, {"theme": "세리", "code": "TAXM-005", "name": "치프 세리 - 프로쿠라토르", "color": "자색", "text": "1. 이 카드는 자신의 묘지에서 3레벨 「세리」 몬스터를 3장 제외하는 것으로 일반소환할 수 있다.\n2. [소환] 자신의 제외 존의 카드를 전부 자신의 덱으로 되돌리고 발동. 되돌린 매수만큼 상대의 덱의 위에서부터 카드를 제외한다.\n3. [유언] 자신의 묘지에서 3레벨 「세리」 몬스터를 2장 특수소환한다.", "type": "몬스터", "level": 9, "race": "인간", "attr": "어둠", "atk": "1500", "deck": "상급", "def": "3000", "tags": ["세리"], "groups": ["세리"]}, {"theme": "세리", "code": "TAXM-006", "name": "소환세", "color": "녹색", "text": "1. 자신의 메인 덱에서 「세리」 몬스터를 1장 골라 자신의 패에 넣는다.\n2. [유언] 이 카드가 상대에 의해 자신의 묘지로 보내진 경우, 자신의 메인 덱의 위에서부터 카드를 3장 제외하고 발동. 이 카드를 자신의 패에 넣는다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서부터 대신 제외한다.", "type": "마법", "deck": "메인", "subtype": "일반", "tags": ["세리"]}, {"theme": "세리", "code": "TAXM-007", "name": "인지세", "color": "자색", "text": "1. [신속] 상대가 카드의 발동을 선언했을 때 발동. 상대는 자신의 메인 덱의 위에서부터 카드를 5장 제외하거나 그 카드를 무효로 한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 상대의 상급 덱의 위에서부터 대신 제외한다.\n2. [유언] 이 카드가 상대에 의해 자신의 묘지로 보내진 경우, 자신의 메인 덱의 위에서부터 카드를 3장 제외하고 발동. 이 카드를 자신의 패에 넣는다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서부터 대신 제외한다.", "type": "마법", "deck": "메인", "subtype": "신속", "tags": ["세리"]}, {"theme": "세리", "code": "TAXM-008", "name": "이탈세", "color": "자색", "text": "1. 이 카드의 3·4번 효과는 동시에 발동할 수 없다.\n2. [트리거] 상대가 자신 필드의 카드를 필드에서 벗어나게 하는 효과의 발동을 선언했을 때 발동. 그 효과를 「자신의 상급 덱의 위에서부터 카드를 5장 제외한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 메인 덱의 위에서부터 대신 제외한다.」로 변경한다.\n3. [유언] 이 카드가 상대에 의해 자신의 묘지로 보내진 경우, 자신의 메인 덱의 위에서부터 카드를 3장 제외하고 발동. 이 카드를 자신의 패에 넣는다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서부터 대신 제외한다.\n4. [유언] 상대의 덱의 위에서부터 카드를 10장 제외한다. 이 효과에 상대는 체인할 수 없다.", "type": "마법", "deck": "메인", "subtype": "트리거", "tags": ["세리"], "rulings": ["2번의 효과 변경 처리는 효과 치환이므로, 치환된 효과는 상대 카드가 그 턴에 이미 발동한 것으로 취급되어 1턴 1회 제약에 걸린 상태가 된다."]}, {"theme": "세리", "code": "TAXM-009", "name": "취득세", "color": "자색", "text": "1. [지속] 서로가 몬스터를 특수소환할 때마다, 그 플레이어는 자신의 덱의 위에서부터 카드를 2장 제외한다. (이 효과는 1턴에 1번 제약을 받지 않는다.)\n2. [유언] 이 카드가 상대에 의해 자신의 묘지로 보내진 경우, 자신의 메인 덱의 위에서부터 카드를 3장 제외하고 발동. 이 카드를 자신의 패에 넣는다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서부터 대신 제외한다.", "type": "마법", "deck": "메인", "subtype": "지속", "tags": ["세리"]}, {"theme": "세리", "code": "TAXM-010", "name": "세 - 아이라리움", "color": "자색", "text": "1. [지속] 서로가 카드를 드로우하거나 덱에서 패에 카드를 넣을 때마다, 그 플레이어는 자신의 덱의 위에서부터 카드를 2장 제외한다. (이 효과는 1턴에 1번 제약을 받지 않는다.)\n2. [지속] 자신 필드의 「세리」 몬스터의 [유언] 효과의 코스트로 자신의 제외 존에서 자신의 덱으로 되돌리는 매수는 1장이 된다. (이 효과는 1턴에 1번 제약을 받지 않는다.)", "type": "필드", "deck": "메인", "tags": ["세리"]}, {"theme": "세리", "code": "TAXM-011", "name": "세제", "color": "자색", "text": "1. [지속] 서로가 효과를 발동할 때마다, 그 플레이어는 자신의 덱의 위에서부터 카드를 1장 제외한다. (이 효과는 1턴에 1번 제약을 받지 않는다.)\n2. 서로가 자신의 메인 덱에서 카드를 9장 제외하고 발동. 자신의 메인 덱에서 2장 드로우한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 상급 덱의 위에서부터 대신 제외한다.\n3. 서로가 자신의 상급 덱에서 카드를 4장 제외하고 발동. 자신의 상급 덱에서 1장 드로우한다. 제외할 카드가 부족할 경우, 부족한 매수만큼을 자신의 메인 덱의 위에서부터 대신 제외한다.", "type": "스킬", "deck": "스킬", "tags": ["세리"], "skill_tags": ["세리"], "skill_groups": ["세리"]}, {"theme": "소원의분수", "code": "WSFT-001", "name": "꿈이 가득한 아이", "color": "녹색", "text": "1. [소환] 메인 덱에서 「코인」 카드를 1장 패에 넣는다.\n2. [트리거] 자신의 「코인」 카드가 덱에서 묘지로 보내졌을 때 발동. 묘지에서 「코인」 몬스터 1장을 패에 넣는다.", "type": "몬스터", "level": 1, "race": "인간족", "attr": "빛", "atk": "200", "deck": "메인", "def": "100", "tags": ["소원의 분수"], "groups": ["소원의 분수"]}, {"theme": "소원의분수", "code": "WSFT-002", "name": "코인 - 희생의 펜던트", "color": "녹색", "text": "1. [트리거] 자신 필드의 카드가 묘지로 보내졌을 때 발동. 이 카드를 패에서 버린다.\n2. [유언] 메인 덱의 위에서부터 카드를 2장 묘지로 보낸다. (이 카드가 덱에서 묘지로 보내졌을 경우 이 효과는 발동하지 않는다.)", "type": "몬스터", "level": 1, "race": "무생물", "attr": "땅", "atk": "0", "deck": "메인", "def": "0", "tags": ["코인", "희생"], "groups": ["코인", "희생"]}, {"theme": "소원의분수", "code": "WSFT-003", "name": "희생의 의사", "color": "청색", "text": "2. [유언] 자신 묘지에서 4레벨 이하의 몬스터를 1장 특수소환한다.", "type": "몬스터", "level": 1, "race": "인간", "attr": "물", "atk": "0", "deck": "메인", "def": "0", "tags": ["희생"], "groups": ["희생"]}, {"theme": "소원의분수", "code": "WSFT-004", "name": "코인 - 용기의 검", "color": "녹색", "text": "1. [트리거] 상대가 몬스터를 소환했을 때 발동. 이 카드를 패에서 버린다.\n2. [유언] 자신의 메인 덱의 위에서부터 카드를 2장 묘지로 보낸다. (이 카드가 덱에서 묘지로 보내졌을 경우 이 효과는 발동하지 않는다.)", "type": "몬스터", "level": 2, "race": "무생물", "attr": "땅", "atk": "900", "deck": "메인", "def": "900", "tags": ["코인", "용기"], "groups": ["코인", "용기"]}, {"theme": "소원의분수", "code": "WSFT-005", "name": "용기의 모험가", "color": "적색", "text": "2. [유언] 필드의 카드 1장을 대상으로 하고 발동. 그 카드를 파괴한다.", "type": "몬스터", "level": 2, "race": "인간", "attr": "땅", "atk": "900", "deck": "메인", "def": "900", "tags": ["용기"], "groups": ["용기"]}, {"theme": "소원의분수", "code": "WSFT-006", "name": "코인 - 지혜의 서", "color": "녹색", "text": "1. [트리거] 상대가 마법 카드를 발동했을 때, 이 카드를 패에서 버린다.\n2. [유언] 자신의 메인 덱의 위에서부터 카드를 2장 묘지로 보낸다. (이 카드가 덱에서 묘지로 보내졌을 경우 이 효과는 발동하지 않는다.)", "type": "몬스터", "level": 3, "race": "무생물", "attr": "땅", "atk": "500", "deck": "메인", "def": "500", "tags": ["코인", "지혜"], "groups": ["코인", "지혜"]}, {"theme": "소원의분수", "code": "WSFT-007", "name": "지혜의 사서", "color": "백색", "text": "2. [유언] 필드의 카드 1장을 대상으로 하고 발동. 그 효과를 턴 종료 시까지 무효로 한다.", "type": "몬스터", "level": 3, "race": "인간", "attr": "불", "atk": "500", "deck": "메인", "def": "500", "tags": ["지혜"], "groups": ["지혜"]}, {"theme": "소원의분수", "code": "WSFT-008", "name": "코인 - 행운의 네잎클로버", "color": "녹색", "text": "1. [신속] 이 카드를 패에서 보여주고 발동. 이 카드를 버린다.\n2. [유언] 메인 덱의 위에서부터 카드를 2장 묘지로 보낸다. (이 카드가 덱에서 묘지로 보내졌을 경우 이 효과는 발동하지 않는다.)", "type": "몬스터", "level": 4, "race": "무생물", "attr": "땅", "atk": "700", "deck": "메인", "def": "700", "tags": ["코인", "행운"], "groups": ["코인", "행운"]}, {"theme": "소원의분수", "code": "WSFT-009", "name": "행운의 도박사", "color": "녹색", "text": "2. [유언] 덱에서 「행운」 카드를 1장 패에 넣는다.", "type": "몬스터", "level": 4, "race": "인간", "attr": "땅", "atk": "700", "deck": "메인", "def": "700", "tags": ["행운"], "groups": ["행운"]}, {"theme": "소원의분수", "code": "WSFT-010", "name": "행운의 도적", "color": "녹색", "text": "1. [소환] 자신 필드의 카드 1장을 묘지로 보내고 발동할 수도 있다. 자신은 덱에서 1장 드로우한다. 카드를 묘지로 보내고 발동했을 경우, 1장 더 드로우한다.\n2. [지속] 자신의 「코인」 카드의 효과를 「메인 덱에서 카드 1장을 묘지로 보낸다」로 변경할 수 있다.\n3. [유언] 묘지에서 이 카드와 「행운」 카드 1장을 덱으로 되돌린다.", "type": "몬스터", "level": 5, "race": "인간", "attr": "어둠", "atk": "1700", "deck": "상급", "def": "700", "tags": ["행운"], "groups": ["행운"]}, {"theme": "소원의분수", "code": "WSFT-011", "name": "지혜의 마법사", "color": "백색", "text": "1. [트리거] 상대가 효과를 발동했을 때 발동. 그 효과를 무효로 한다.\n2. [트리거] 카드를 파괴하는 효과가 발동되었을 때 발동. 그 효과를 무효로 한다. (이 효과의 사용 후, 다음 턴까지 자신은 이 효과를 사용할 수 없다.)\n3. [유언] 묘지에서 이 카드와 「지혜」 카드 1장을 덱으로 되돌린다.", "type": "몬스터", "level": 6, "race": "인간", "attr": "땅", "atk": "1500", "deck": "상급", "def": "500", "tags": ["지혜"], "groups": ["지혜"]}, {"theme": "소원의분수", "code": "WSFT-012", "name": "용기의 전사", "color": "적색", "text": "1. [신속] 상대 필드의 카드 1장을 대상으로 하고 발동. 그 카드를 파괴한다. 이 카드의 공격력은 턴 종료 시까지 1000 오른다.\n2. [지속] 이 카드가 존재하는 한, 자신 필드의 「용기」 몬스터는 2회 공격할 수 있다.\n3. [유언] 묘지에서 이 카드와 「용기」 카드 1장을 덱으로 되돌린다.", "type": "몬스터", "level": 7, "race": "인간", "attr": "땅", "atk": "1900", "deck": "상급", "def": "900", "tags": ["용기"], "groups": ["용기"]}, {"theme": "소원의분수", "code": "WSFT-013", "name": "희생의 성녀", "color": "청색", "text": "1. [소환] 자신 묘지에서 몬스터를 1장 특수소환한다.\n2. [트리거] 자신 필드의 카드가 묘지로 보내졌을 경우, 이 카드를 묘지로 보내고 발동. 묘지로 보내진 카드에 따라 효과가 정해진다.\n- 몬스터: 그 카드를 자신 필드에 특수소환한다.\n- 지속 마법·필드 마법: 그 카드를 자신 필드에 앞면으로 놓는다.\n- 일반·트리거·신속 마법: 그 카드를 자신 필드에 세트한다.\n3. [유언] 묘지에서 이 카드와 「희생」 카드 1장을 덱으로 되돌린다.", "type": "몬스터", "level": 8, "race": "인간", "attr": "물", "atk": "1000", "deck": "상급", "def": "1000", "tags": ["희생"], "groups": ["희생"]}, {"theme": "소원의분수", "code": "WSFT-014", "name": "기적의 영웅", "color": "황색", "text": "1. 이 카드는 스킬 카드의 효과로만 특수소환할 수 있다.\n2. [지속] 필드의 이 카드는 릴리스할 수 없으며, 다른 카드의 효과를 받지 않는다. 필드의 이 카드는 「행운」·「용기」·「지혜」·「희생」 카드로도 취급한다.\n3. [신속] 상대 필드의 카드 1장을 파괴한다. 이 카드의 공격력/수비력을 1000 내린다. (이 효과는 1턴에 1번 제약을 받지 않는다.)\n4. [트리거] 상대가 카드의 효과를 발동했을 때 발동. 그 효과를 무효로 하고, 이 카드의 공격력/수비력을 1000 내린 function renderPool(){
 const q=$('q').value.trim(),ft=$('ftype').value,fd=$('fdeck').value,all=$('fshow').value==='all';
 const list=POOL.filter(c=>(!ft||c.type===ft)&&(!fd||c.deck===fd)&&(all||allowed(c)||c.type==='스킬')

  const meta=c.type==='몬스터'?`${c.code||''} · Lv${c.level} · ${c.deck} · ${c.atk}/${c.def}`:`${c.code||''} · ${c.type}${c.subtype?'('+c.subtype+')':''}`;

 for(const p of ['메인','상급','전략']){const e=Object.entries(deck[p]);const tot=e.reduce((a,[,n])=>a+n,0);const [lo,hi]=LIM[p];

 $('deck').innerHTML=h;

function validate(){
 const e=[],w=[];const s=byName[$('skill').value];
 for(const p in LIM){const tot=Object.values(deck[p]).reduce((a,b)=>a+b,0);const[lo,hi]=LIM[p];if(tot<lo||tot>hi)e.push(`[${p}] ${tot}장 — 허용 범위 ${lo}~${hi}장`);
  for(const n in deck[p]){const c=byName[n];if(c.type==='스킬'){if(p!=='전략')e.push(`[${p}] 스킬 카드 「${n}」은(는) 전략 덱에만 넣을 수 있음`);continue;}
   if(!allowed(c))e.push(`[${p}] 「${n}」은(는) 스킬 「${s.name}」로 사용할 수 없음`);
   if(p==='메인'&&c.deck!=='메인')e.push(`[메인] 「${n}」은(는) 상급 덱 카드`);if(p==='상급'&&c.deck!=='상급')e.push(`[상급] 「${n}」은(는) 메인 덱 카드`);}}

 for(const n in deck.전략)if(inMainUpper(n)+deck.전략[n]>3)w.push(`[전략] 「${n}」 전량 교체 시 ${inMainUpper(n)+deck.전략[n]}장이 될 수 있음`);

 txt.split(/\r?\n/).forEach((raw,i)=>{const l=raw.split('#')[0].trim();if(!l)return;let m;
  if(m=l.match(/^이름\s*[:：]\s*(.+)$/)){$('dname').value=m[1];return;}
  if(m=l.match(/^스킬\s*[:：]\s*(.+)$/)){const s=byName[m[1].trim()]||byCode[m[1].trim()];if(s&&s.type==='스킬')$('skill').value=s.name;else errs.push(`${i+1}행: 스킬 「${m[1]}」 없음`);return;}
  if(m=l.match(/^\[(메인|상급|전략)\]$/)){sec=m[1];return;}
  if((m=l.match(/^(\d+)\s*[xX×]?\s+(.+)$/))&&sec){const c=byName[m[2].trim()]||byCode[m[2].trim()];if(c){deck[sec][c.name]=(deck[sec][c.name]||0)+ +m[1];return;}}
  errs.push(`${i+1}행: 「${raw.trim()}」 해석 불가`);});
 render();if(errs.length)$('msgs').insertAdjacentHTML('afterbegin',errs.map(x=>`<li class="e">✗ ${x}</li>`).join(''));}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-add],[data-sub],[data-show]');if(!b)return;
 if(b.dataset.add)add(b.dataset.add,b.dataset.part);else if(b.dataset.sub)sub(b.dataset.sub,b.dataset.part);else show(b.dataset.show);});
['q','ftype','fdeck','fshow'].forEach(id=>$(id).addEventListener('input',renderPool));
$('skill').addEventListener('change',render);$('dname').addEventListener('input',exportText);
$('copy').onclick=()=>{navigator.clipboard.writeText($('out').value).then(()=>{$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='복사',1200)})};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('out').value],{type:'text/plain'}));a.download=($('dname').value||'deck').replace(/[\\/:*?"<>|]/g,'_')+'.deck';a.click();};
$('imp').onclick=()=>importText($('out').value);
$('clear').onclick=()=>{for(const p in deck)deck[p]={};render();};
render();
</script></body></html>
