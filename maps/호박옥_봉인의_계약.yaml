  - id: E
    이름: 침전 — 「호박옥」 카드만 사용 제약
    공통: true # .md 7-1 — 상대 "덱 종류"가 아니라 자신 카드가 이 덱(테마) 소속인지만 보는
      # 제약이라 공통으로 둔다(균열 · 티라누스 4번과 같은 이유 — C·D 노드 참조)
    우선순위: 4
    참고:
      - "6-1 — 제약은 발동한 자신 턴 + 다음 상대 턴 전체를 덮는다. 이 덱이 실제로 넣을 수 있는
        비「호박옥」 카드는 공용 10종(메인의 태양과 달의 마력 + 전략 덱 9종)뿐이라 .md 는 그
        10종만 표로 짚었지만, 제약 자체는 전체 비「호박옥」 카드를 겨눈다 — 아래 금지도
        10종으로 좁히지 않고 '이 덱 소속이 아닌 카드' 전체로 썼다(비덱카드목록())"
      - "6-2 — 제약 중에도 호박옥 자체 대응 수단(황금봉랍 · 균열 · 임시 봉인 · 결정충 · 레시나 ·
        실렉스)은 전부 호박옥 소속이라 이 금지에 걸리지 않고 살아 있다. 대응력이 0이 되는
        제약이 아니다"
      - "6-3 — '침전을 언제 쓰는가'(비용이 0인지, 상대 덱이 효과 발동 위주인지)는 '어느 쪽이
        더 좋은가'의 판단이라 1층 필터가 아니라 상위 층(belief → 착취 → CFR)이 할 일이다
        (맵_형식.md 7장, C 노드 4-2와 같은 처리). A 노드의 '비상 수입 보충' 간선이 침전 발동
        자체를 후보로 이미 낸다 — 이 E 노드는 '쓰면 생기는 제약' 쪽만 담는다"
      - "강제 트리거(6-4① — [트리거]·[유언] '(이 효과는 강제로 발동한다.)')는 아래 금지에서
        따로 빼지 않았다. 6-4①의 결론대로 강제 효과는 플레이어가 선택하는 '수'가 아니라서
        애초에 합법수 생성이 내는 가용수단 · 후보 목록에 오를 대상이 아니다(합법수 생성은
        완성_기준.md 4번, 아직 1층 필터 쪽에서 쓸 수 있게 완성되지 않았다) — 그래서 이 금지가
        '발동' · '소환'만 가리키는 것으로 충분하고, 강제 트리거를 걸러 내는 예외 간선을 별도로
        만들 필요가 없다"
      - "코스트 · 릴리스 재료 사용(6-4②)도 따로 빼지 않았다 — engine/action.py 의 `구체동작`
        집합이 '계승' · '릴리스'를 '발동' · '소환'과 이미 다른 동작 이름으로 분류해 둔다
        (엔진 착수 때부터). 아래 금지는 '발동(...)' · '소환(...)'만 가리키므로 '계승(...)' ·
        '릴리스(...)' 꼴 후보와는 동작 이름 자체가 달라 대조되지 않는다 — 6-4②를 뒤집지 않고
        금지의 모양만으로 그대로 반영한다"
      - "룰지 5장 키워드표의 '세트'(로드)도 문면상 '사용'에 들어가지만, engine/action.py 에
        그 동작 이름이 아직 없다 — 이 금지가 못 덮는 동작으로 남겨 둔다(합법수 생성이 세트/로드
        동작을 추가하면 이 금지의 금지 목록에도 '세트(비덱카드목록())' 를 더할 것. 진행.md
        다음 할 일 참고)"
      - "'침전제약활성()' 표지를 정확히 언제 붙이고 언제 떼는지(발동 턴 + 다음 상대 턴 **종료**
        시점)는 턴 전이를 실제로 진행시키는 엔진이 아직 없어 이 노드가 계산하지 않는다 —
        `임시봉인상태유닛()`과 같은 한계(진행.md 29회차 기록 참조). 표지는 지금은 시험 · 데모가
        손으로 채운다"
      - "98회차 — 엔진 쪽은 이걸로 닫혔다. `engine/turn.py` `상태표지_턴경계_정리()`가 위 문단의
        턴 경계(발동 턴 + 다음 상대 턴 종료)를 `resolve.금지()`의 '금지:비덱카드:{기간}' 표지로
        실제로 계산하고, `침전제약활성()`도 그 꼴을 읽도록 고쳤다(`engine/predicates.py`).
        `cards/효과/호박옥.yaml` '호박옥 - 침전' 1번 참조. **바로 위 참고(세트/로드 동작 이름
        없음)는 아직 안 닫혔다** — 44회차가 `engine/legalmoves.py`에 로드(...) 동작을 실제로
        추가했지만, 이 맵 파일이 쓰는 `engine/action.py`의 `구체동작` 집합(필터 전용 어휘)에는
        여전히 '로드'가 없다. 이 노드 아래 금지 목록에 '로드(비덱카드목록())'를 더하는 것은
        `action.py`의 어휘를 넓히는 별개 작업이라(엔진 쪽 효과·합법수 구현과는 다른 계층 —
        맵/전략 필터) 98회차 범위 밖으로 남겨 뒀다 — 추측으로 같이 안 연다."

    간선:
      - 이름: 비호박옥 카드 사용 금지
        조건: "침전제약활성()"
        자원: 없음
        목적: 사용제약
        후보: []
        금지: ["발동(비덱카드목록())", "소환(비덱카드목록())"]
        근거: ".md 6-1·6-4①·6-4② — 침전 발동 턴부터 다음 상대 턴 종료까지 「호박옥」 카드만
          발동 · 소환할 수 있다. 강제 트리거(6-4①) · 코스트 · 릴리스 재료 사용(6-4②)은 각각
          '선택 가능한 수가 아님' · '발동/소환과 다른 동작 이름'이라는 이유로 저절로 이 금지에
          안 걸린다(위 참고 참조) — 그래서 예외 간선을 따로 두지 않았다"

