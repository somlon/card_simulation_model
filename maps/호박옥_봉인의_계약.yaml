        조건: "패.있음('호박옥 - 태고의 수해') and not 필드.있음('호박옥 - 태고의 수해')"
        자원: 없음
        후보: ["발동('호박옥 - 태고의 수해')"]
        근거: ".md 3-4 — 수해 1장이 사이클 수지(+1 자신 턴, +1 상대 턴, −2 세금)를 정확히 0으로
          만든다. A의 최우선 간선"

      - 이름: 세금 차감 위치
