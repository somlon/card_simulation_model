          - "표시변경('호박옥 - 아우렘 티라누스', 공격)"
          - "공격선언('호박옥 - 아우렘 티라누스')"
        근거: ".md 5-3 다섯 조건을 그대로 매핑 — 1=직접공격가능()(상대 필드에 앞면 유닛 없음,
          룰지 3-3. 엔진_상태모델.md 8장에 이미 '상대앞면유닛수()==0'과 동치로 정의돼 있어 그대로
          재사용) · 2=리설가능(타격합)(타격 합 ≥ 상대 현재 HP, 이번 턴에 끝남) ·
