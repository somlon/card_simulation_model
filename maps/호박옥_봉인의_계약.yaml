      - 이름: 티라누스 비우기 금지 (기본)
        조건: "항상"
        자원: 카운터
        목적: 피니시전환
        후보: []
        금지: ["발동('호박옥 - 아우렘 티라누스', 4, 제거개수=잔량전부)"]
        근거: ".md 5-2·5-3 — 카운터를 0으로 비우면 벽(「호박옥」 외 효과 면역·전투 파괴 내성·
          릴리스 내성)이 사라지고 표시 형식 변경이 가능해진다. 되돌릴 카운터 복구 수단이
