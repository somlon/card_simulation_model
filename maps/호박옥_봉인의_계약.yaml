        금지: ["세금차감(임시봉인상태유닛())"]
        근거: ".md 3-5 — 카운터가 가장 많이 쌓인 유닛에서 빼되 잔량 1을 남겨 면역을 유지한다
          (집중 보유). 금지 쪽은 .md 3-7 — 재정 9차 로그17②(임시 봉인 상태에서는 「호박옥」
          카드의 효과도 받지 않아 떼지 못해 2000 자해) · 재정 6차 Q58(임시 봉인 상태인 카드에는
          카운터를 놓을 수도 없다). **60회차 재정만을 유일 근거로 쓴 결론 재점검 — 룰지에서
          직접 확인됨으로 승격.** 룰지 386~387행이 이 사례 자체를 예시로 쓴다(「다른 카드의
          효과를 받지 않는다」 효과를 받은 카드(「임시 봉인」)의 카운터는 다른 카드의 효과로
          제거할 수 없고, 제거하지 못한 만큼 2000 대미지를 받는다) — 재정이 룰지를 보충하는
          관계가 아니라 룰지 본문이 이미 같은 숫자로 확정해 둔 사례였다. 결론 변경 없음"

