# 호박옥 · 봉인의 계약 — 1층(경질) 필터 맵. 기계가 읽는 정본.
# 사람이 읽는 설명 · 근거 전문은 maps/호박옥_봉인의_계약.md (이 파일의 `근거:`가 그 절 번호를 가리킨다).
# 식 언어: 산술 비교 · and/or/not · 함수 호출만. 분기 · 반복 · 변수 정의 없음 (docs/맵_형식.md 7장).
# 1층에는 `가중:`을 쓰지 않는다 — 통과/탈락만 낸다 (docs/맵_형식.md 7-1·7-2).
#
# 간선의 축 (2026-10-25 결정 — docs/엔진_착수_2026-10-25.md 2장의 갭을 메운 것):
#   자원:  이 간선이 쓰는 자원 이름. 추상 동작 금지(`카운터지출`)는 후보가 아니라 이것과 대조된다.
#          자원을 안 쓰는 간선은 `없음`으로 명시한다(미선언이면 검증이 참고로 집어낸다)
#   목적:  이 간선의 목적(제거 · 재전개 · 세금납부 …). 목적은 후보 하나하나가 아니라 간선의 성질이다
#   예외:  이 간선이 깨는 금지 — 금지를 건 **간선의 이름**을 적는다(.md 4-6 「금지선보다 우선한다」)
#
# 이식 진행 (30회차) — A(세금 미납 방지, 3장) · B·C(경합, 4장) · D(피니시, 5장) ·
# E(침전 제약, 6장) · F(상대 덱별 분기, 7장) 이식 완료. .md 3~7장 전부 대응 노드가 있다.
# F는 다른 노드들과 모양이 다르다 — 7장 자체가 "심리 층이 붙을 자리"를 표시하는 경계
# 문서라 1층이 거를 금지·후보가 없다(아래 F 노드 참고 참조). 간선이 없다.

덱: 호박옥-봉인의 계약
설명_문서: maps/호박옥_봉인의_계약.md

# 덱별 상수. 술어(코드)는 덱과 무관한 공용 함수여야 하므로(docs/맵_형식.md 4장) 덱마다 다른
# 수는 맵이 넘긴다. 2026-10-25 엔진 착수 때 추가 — 지출가능() = 잔고 − 세금 − 벽유지분() 을
# 코드로 돌리려면 세금 값이 맵에 있어야 했다.
덱상수:
  세금: 2            # .md 3-1 — 스킬 「봉인의 계약」의 턴당 유지비
  카운터명: 봉인      # .md 1장 — 이 덱의 자원은 봉인 카운터
  벽유지최소: 1      # .md 3-5 — 유닛당 잔량 1을 남기면 파괴·릴리스·대상지정 면역이 유지된다
  테마: 호박옥        # .md 6장 — data/card_pool.json 의 theme 필드값. E 노드 「비덱카드목록()」이
                      # "이 덱 소속이 아닌 카드"를 가리키는 데 쓴다(29회차 신설)

노드:
  - id: A
    이름: 세금 미납 방지
    공통: true # .md 7-1 — 상대 정보 불필요. 자신의 잔고·확정수입만으로 닫힌다
    우선순위: 0 # 가장 먼저 본다. 다른 모든 판단보다 앞선다 (.md 3장 머리말)
