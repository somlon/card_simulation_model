    참고:
      - "확정수입() 분류표는 .md 3-3 참조 — 확정: 태고의 수해 필드 유지(+1/턴) · 수호자 4종
        소환(+2) · 아우렘 티라누스 소환(+3) · 침전(+2) · 결정충(+1). 조건부([유언] · [트리거] 수입:
        잔편 · 수액정 · 각성의 태동 · 황금봉랍 · 레시나)는 확정수입()에 넣지 않는다"
      - "조건부 수입이 확정수입()에 안 들어가는 것은 사전 예산 편입을 막을 뿐, 실제로 트리거되어
        카운터가 필드에 놓이면 잔고()가 그 시점의 실측값이라 재측정 시 자동으로 반영된다(별도
        옮겨 적기 절차 없음) — .md 3-3①, 룰지 3-6 c(발동이 나중에 무효화돼도 발동 자체는 유효)"
      - "자신의 턴 종료 단계에 수입(태고의 수해 +1)과 세금(−2)이 같은 시점에 함께 처리될 때,
        순서는 턴 플레이어가 정한다 — 수해를 먼저 받고 세금을 낸 뒤라야 아래 불변식이 맞게
        평가된다. 순서를 거꾸로 하면 잔고 1일 때 불필요하게 1000 자해가 난다.
        근거: .md 3-1, 룰지 3-6 b, 재정 Q24(4차 · 2026-10-21, 「침전 유지비와 녹스 솜니페르
        4번의 처리 순서」 → 순서는 플레이어가 결정). 이 순서는 한 플레이어 자신의 카드들
        사이의 순서 선택이라 G1 충돌(상대 체인 처리 순서, rules/충돌목록.md #1)과는 별개다"

    간선:
