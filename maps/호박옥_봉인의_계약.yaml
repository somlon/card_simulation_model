      # 자리다. A·B·C·D·E는 각자 공통인지 아닌지를 스스로 판단해 공통:true로 두지만, F는
      # 애초에 상대 의존성 그 자체를 다루므로 false로 둔다
    우선순위: 5
    참고:
      - "7장 전체는 다른 노드와 모양이 다르다 — '어느 수를 거를 것인가'가 아니라 '어느 판단이
        상대 정보를 요구하는가'를 표시하는 **경계 문서**다(.md 7장 제목 그대로 '심리 층이
        붙을 자리'). 그래서 이 노드에는 금지·후보가 없다 — 1층은 '무엇이 가능한가'만 답하고
        '무엇이 좋은가'는 답하지 않는다는 원칙(맵_형식.md 7-2)의 가장 분명한 사례다"
      - "7-1 — A는 자신의 잔고·확정수입만으로 닫혀 상대 정보가 불필요하다(공통). B(벽 ·
        어느 수호자를 세우나) · C(제거 · 무엇을 먼저 치우나) · D(피니시 · 직접공격 경로를
        여는 비용) · E(침전 · 제약의 실질 비용)는 전부 상대 축에 따라 갈린다. 주의 — 이
        'B·C·D·E 분기'는 YAML의 `공통:` 플래그와 다른 축을 가리킨다. B·C·D·E가 `공통:true`인
        것은 그 노드들의 **1층 런타임 간선**이 상대 '덱 종류'를 묻지 않고도 계산되기 때문이고
        (조건이 상대앞면유닛수() · 상대필드카드수() 같은 그 순간의 공개 정보만 본다 — B·C·D
        노드 자신의 공통 주석 참조), 7-1이 말하는 '분기'는 **덱 구성 · 전략 선택**(어느 수호자를
        넣을까, 침전을 언제 쓸까)이 상대 덱에 따라 달라진다는 뜻이다. 둘은 서로 다른 질문이라
        충돌이 아니다 — 하나는 '이 간선이 상대 덱 이름을 변수로 쓰는가', 다른 하나는 '이
        판단의 좋고 나쁨이 상대 덱에 따라 갈리는가'"
      - "7-2 — 수호자 4종(레시나·실렉스·마르모르·카르분쿨루스)은 전부 「릴리스되지 않는다」를
        공유하고 추가 내성만 갈린다(파괴 무효 · 비파괴 이탈 무효 · 비대상 효과 무효 · 대상
        효과 무효). 상대 제거 카드가 「대상으로 하고 발동」(대상)인지 「고르고」(비대상)인지로
        마르모르 vs 카르분쿨루스가 갈린다(재정 6차 Q2) — 기존 술어 `대상지정효과인가(카드)`로
        이미 계산 가능하다. 그래도 간선으로 옮기지 않았다 — 네 수호자 모두 소환 자체는 항상
        합법(A '비상 수입 보충'이 이미 네 종류 다 후보로 낸다)이고, '어느 쪽이 더 막아 주는가'는
        금지·후보가 아니라 **선호**의 문제라 C의 4-2 우선순위(27회차)·D의 5-5(28회차)와 같은
        이유로 1층 밖, 상위 층(belief → 착취)의 일이다"
      - "7-3 — 11덱 중 직접 걸리는 상대 요약(전문은 .md 7-3 표). 저주인형(스킬 1번 효과 무효
        누적 — 싼 효과로 먼저 소모) · 세제(효과 발동마다 덱 제외 — 상급덱 회전축 직격) ·
        포커짐승들(비대상 컨트롤 탈취 — 마르모르) · 번성충(전투 대미지 상승 — 벽 유지로 맞섬)·
        데이터버그(필드 과밀로 직접공격 경로 봉쇄 — D 비용 최대) · 던전마스터(뒷면은
        직접공격을 안 막음 — 오히려 쉬운 상대) · 투기장(전투 유도 드로우 — 장기전 불리) ·
        소원의 분수 · 솔루나 아츠(묘지·트리거 축 — 침전 제약과 정면 충돌, E의 비용 최대) ·
        몽식의 계약(미러 — 두 번째 덱 작성 후 채운다, 아직 비어 있음). 이 표는 필터 규칙이
        아니라 2층(belief)이 상대 모델을 세울 때 참조할 재료다"
      - "7-4 — 심리 층이 실제로 추론해야 할 숨은 정보 네 가지: ① 상대가 로드한 이펙트 카드
        정체(D 비용 산정 전에 필요) ② 상대 패의 제거 카드 보유 여부(벽 유지 장수 결정) ③ 그
        제거가 대상 지정인가 비대상인가(7-2의 수호자 선택) ④ 상대 묘지·제외 존 상태(세제 ·
        소원의 분수류 자원 카운트). 이 네 가지는 전부 2층(belief)의 입력이고 1층이 채울 수
        없다 — 완성 기준 1~3번(1층 맵 이식 · 검증)의 범위 밖이며, 완성 기준 4번(합법수 생성)
        이후 belief 설계 문서에서 따로 다룰 일로 명시해 둔다(추측으로 채우지 않는다)"

