          and 표시변경가능('호박옥 - 아우렘 티라누스') and 필드.카운터합(제외=['호박옥 - 아우렘
          티라누스']) >= 1"
        자원: 카운터
        목적: 피니시전환
        예외: ["티라누스 비우기 금지 (기본)"]
        후보:
