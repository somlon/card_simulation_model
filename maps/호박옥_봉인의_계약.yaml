      - "5-4 — 스킬 3번('자신 필드에 봉인 카운터가 놓인 몬스터가 존재하는 한 전투 대미지 절반')은
        티라누스 전용 조항이 아니다. '존재하는 한'이라 다른 몬스터에 카운터 1개만 있어도 유지된다
        — 아래 간선 조건 5(필드.카운터합)의 근거"
      - "5-5 — 상대 필드를 비워 직접공격 경로를 여는 수단(카르분쿨루스 3번 · 균열 · 티라누스
        4번)은 이미 C 노드의 간선이다. D는 새 제거 수단을 만들지 않고, '그 수단으로 티라누스
        자신의 카운터까지 0으로 비우는 것'만 추가로 게이트한다"

